}

/* ------------------------------ FILTRAGEM ------------------------------ */
function applyFilters(list){
  const f = state.filters;
  return list.filter(d=>{
    if(f.periodoIni && (!d._dSol || d._dSol < parseD(f.periodoIni))) return false;
    if(f.periodoFim && (!d._dSol || d._dSol > parseD(f.periodoFim))) return false;
    if(f.responsavel.length && !f.responsavel.includes(d.responsavel)) return false;
    if(f.editoria.length && !f.editoria.includes(d.editoria)) return false;
    if(f.areaSolicitante.length && !f.areaSolicitante.includes(d.areaSolicitante)) return false;
    if(f.status.length && !f.status.includes(d.status)) return false;
    if(f.prioridade.length && !f.prioridade.includes(d.prioridade)) return false;
    if(f.complexidade.length && !f.complexidade.includes(d.complexidade)) return false;
    if(f.publicoAlvo.length && !f.publicoAlvo.includes(d.publicoAlvo)) return false;
    if(f.canalPrincipal.length && !f.canalPrincipal.includes(d.canalPrincipal)) return false;
    if(f.statusEditorial.length && !f.statusEditorial.includes(d.statusEditorial)) return false;
    return true;
  });
}
function clearFilters(){
  state.filters = { periodoIni:null, periodoFim:null, responsavel:[], editoria:[], areaSolicitante:[], status:[], prioridade:[], complexidade:[], publicoAlvo:[], canalPrincipal:[], statusEditorial:[] };
  state._specialFilter=null;
  renderView();
}
function removeFilterValue(key,val){
  if(key==='periodo'){ state.filters.periodoIni=null; state.filters.periodoFim=null; }
  else state.filters[key] = state.filters[key].filter(v=>v!==val);
  renderView();
}
function toggleMultiFilter(key,val){
  const arr = state.filters[key]; const i = arr.indexOf(val);
  if(i>-1) arr.splice(i,1); else arr.push(val);
  renderView();
}
function clearFiltersSilent(){ state.filters = { periodoIni:null, periodoFim:null, responsavel:[], editoria:[], areaSolicitante:[], status:[], prioridade:[], complexidade:[], publicoAlvo:[], canalPrincipal:[], statusEditorial:[] }; state._specialFilter=null; }
function temFiltroAtivo(){
  const f = state.filters;
  return !!(f.periodoIni || f.periodoFim || state._specialFilter ||
    ['responsavel','editoria','areaSolicitante','status','prioridade','complexidade','publicoAlvo','canalPrincipal','statusEditorial'].some(k=> f[k].length));
}
function applySpecialFilter(list){
  const sf = state._specialFilter;
  if(!sf) return list;
  if(sf.atrasadaOnly) return list.filter(d=>d.atrasada);
  if(sf.vence7Only) return list.filter(d=>!STATUS_FINAIS.includes(d.status) && d.diasParaPublicacao!==null && d.diasParaPublicacao>=0 && d.diasParaPublicacao<=7);
  if(sf.foraSlaOnly) return list.filter(d=>d.sla==='Fora');
  if(sf.agingBucket) return list.filter(d=>d.aging===sf.agingBucket && !STATUS_FINAIS.includes(d.status));
  if(sf.comAlertaOnly) return list.filter(d=>d.alertaEditorial);
  if(sf.predicate) return list.filter(sf.predicate);
  return list;
}
/* Comportamento padrão de "card responsivo": clique que resulta em exatamente
   1 registro abre o detalhe direto; mais de 1, abre a lista já filtrada. */
function goToDemandas(){
  const preview = applySpecialFilter(applyFilters(state.demandas));
  if(preview.length===1){ openDetailModal(preview[0].id); }
  else if(preview.length===0){ toast('Nenhum registro encontrado para este indicador.', true); navigate('demandas'); }
  else { navigate('demandas'); }
}

/* ------------------------------- TOASTS -------------------------------- */
function toast(msg, isErr){
  const c = $('#toastContainer');
  const el = document.createElement('div');
  el.className = 'toast'+(isErr?' err':'');
  el.innerHTML = `<span class="dot"></span><span>${esc(msg)}</span>`;
  c.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2600);
}

  $('#pageSub').textContent = titles[view][1];
  const btnNew = $('#btnNewGlobal'); if(btnNew) btnNew.style.display = state.readOnly ? 'none' : '';
  const roBadge = $('#readOnlyBadge'); if(roBadge) roBadge.style.display = state.readOnly ? 'inline-flex' : 'none';
  renderView();
}

function refreshTopStats(){
  $('#sfCount').textContent = state.demandas.length;
  const meta = ds._meta;
  const d = new Date(meta.lastUpdate);
  const str = d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
  $('#sfTime').textContent = str;
  $('#lastUpdateChip').textContent = 'Atualizado em ' + str;
}

function renderView(){
  recomputeDerived();
  refreshTopStats();
  if(state.view==='dashboard') renderDashboard();
  else if(state.view==='visaogeral') renderVisaoGeral();
  else if(state.view==='demandas') renderDemandasView();
  else if(state.view==='kanban') renderKanban();
  else if(state.view==='report') renderOnePageReport();
  else if(state.view==='config') renderConfigView();
}

/* ============================ CHIPS DE FILTRO ATIVO ============================ */
function renderActiveFilterChips(){
  const f = state.filters; const chips=[];
  if(f.periodoIni||f.periodoFim) chips.push(`<div class="chip">Período: ${f.periodoIni?fmtD(f.periodoIni):'início'} – ${f.periodoFim?fmtD(f.periodoFim):'hoje'}<button data-fk="periodo" data-fv="">${ICONS.x}</button></div>`);
  ['responsavel','editoria','areaSolicitante','status','prioridade','complexidade','publicoAlvo','canalPrincipal','statusEditorial'].forEach(k=>{
    f[k].forEach(v=> chips.push(`<div class="chip">${esc(v)}<button data-fk="${k}" data-fv="${esc(v)}">${ICONS.x}</button></div>`));
  });
  if(!chips.length) return '';
  return `<div class="active-filters">${chips.join('')}<button class="btn btn-sm btn-ghost" id="btnClearFilters">Limpar filtros</button></div>`;
}
function bindActiveFilterChips(root){
  $$('.chip button', root).forEach(b=> b.onclick = ()=> removeFilterValue(b.dataset.fk, b.dataset.fv));
  const cb = $('#btnClearFilters', root); if(cb) cb.onclick = clearFilters;
}
function multiselect(id, label, options, selectedArr){
  return `<div class="filter-field"><label>${esc(label)}</label>
    <div class="multiselect" data-ms="${id}">
      <button type="button" class="multiselect-btn" data-ms-toggle="${id}"><span>${selectedArr.length? selectedArr.length+' selecionado(s)' : 'Todos'}</span><span style="opacity:.5">▾</span></button>
      <div class="multiselect-panel hidden" data-ms-panel="${id}">
        ${options.map(o=>`<label><input type="checkbox" data-ms-key="${id}" value="${esc(o)}" ${selectedArr.includes(o)?'checked':''}> ${esc(o)}</label>`).join('') || '<div class="empty-state" style="padding:10px">Nenhuma opção</div>'}
      </div>
    </div></div>`;
}
function bindMultiselects(root, onchange){
  $$('[data-ms-toggle]', root).forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); const id = btn.dataset.msToggle;
      $$('.multiselect-panel', root).forEach(p=>{ if(p.dataset.msPanel!==id) p.classList.add('hidden'); });
      $(`[data-ms-panel="${id}"]`, root).classList.toggle('hidden'); };
  });
  $$('[data-ms-key]', root).forEach(chk=> chk.onchange = ()=> onchange(chk.dataset.msKey, chk.value));
  document.addEventListener('click', ()=> $$('.multiselect-panel', root).forEach(p=>p.classList.add('hidden')), {once:true});
}
function renderFilterBar(){
  const lists = activeLists();
  return `
    <div class="filter-field"><label>Período (data solicitação)</label>
      <div style="display:flex;gap:6px;"><input type="date" id="fPeriodoIni" value="${state.filters.periodoIni||''}"><input type="date" id="fPeriodoFim" value="${state.filters.periodoFim||''}"></div>
    </div>
    ${multiselect('responsavel','Responsável / Owner', lists.responsaveisAll, state.filters.responsavel)}
    ${multiselect('editoria','Editoria', lists.editorias, state.filters.editoria)}
    ${multiselect('areaSolicitante','Área solicitante', lists.areas, state.filters.areaSolicitante)}
    ${multiselect('status','Status', lists.status, state.filters.status)}
    ${multiselect('prioridade','Prioridade', lists.prioridades.map(p=>p.nome), state.filters.prioridade)}
    ${multiselect('complexidade','Complexidade', lists.complexidades.map(x=>x.nome), state.filters.complexidade)}
    ${multiselect('publicoAlvo','Público-alvo', lists.publicos, state.filters.publicoAlvo)}
    ${multiselect('canalPrincipal','Canal principal', lists.canais, state.filters.canalPrincipal)}
    ${multiselect('statusEditorial','Status editorial', lists.statusEditorial, state.filters.statusEditorial)}
    <button class="btn" id="btnClearFiltersBar">Limpar filtros</button>

function bindFilterBar(root, onRerender){
  $('#fPeriodoIni',root).onchange = e=>{ state.filters.periodoIni = e.target.value||null; onRerender(); };

}

const TONE_BG = {crit:'var(--crit-tint)', warn:'var(--warn-tint)', ok:'var(--ok-tint)', '':'var(--gray-100)'};
const TONE_FG = {crit:'var(--crit)', warn:'var(--warn)', ok:'var(--ok)', '':'var(--gray)'};
function infoIcon(text){
  return `<div class="info-ico" data-info-toggle>i<div class="info-pop hidden">${esc(text)}</div></div>`;
}
function bindInfoIcons(root){
  $$('[data-info-toggle]', root).forEach(btn=>{
    /* Abre no hover (mouse) e mantém o clique para telas de toque. */
    const abrir = ()=>{
      const pop = $('.info-pop', btn);
      const card = btn.closest('.kpi-card, .panel');
      $$('.info-pop', root).forEach(p=>{ if(p!==pop) p.classList.add('hidden'); });
      $$('.popover-open', root).forEach(c=>{ if(c!==card) c.classList.remove('popover-open'); });
      pop.classList.remove('hidden','align-left');
      if(card) card.classList.add('popover-open');
      requestAnimationFrame(()=>{ if(pop.getBoundingClientRect().left < 8) pop.classList.add('align-left'); });
    };
    const fechar = ()=>{
      const pop = $('.info-pop', btn);
      const card = btn.closest('.kpi-card, .panel');
      pop.classList.add('hidden');
      if(card) card.classList.remove('popover-open');
    };
    btn.onmouseenter = abrir;
    btn.onmouseleave = fechar;
    btn.onclick = (e)=>{
      e.stopPropagation();
      const pop = $('.info-pop', btn);
      const card = btn.closest('.kpi-card, .panel');
      const opening = pop.classList.contains('hidden');
      $$('.info-pop', root).forEach(p=>{ if(p!==pop) p.classList.add('hidden'); });
      $$('.popover-open', root).forEach(c=>{ if(c!==card) c.classList.remove('popover-open'); });
      pop.classList.toggle('hidden', !opening);
      pop.classList.remove('align-left');
      if(card) card.classList.toggle('popover-open', opening);
      if(opening){
        requestAnimationFrame(()=>{
          const r = pop.getBoundingClientRect();
          if(r.left < 8) pop.classList.add('align-left');
        });
      }
    };
  });
  document.addEventListener('click', ()=>{
    $$('.info-pop', root).forEach(p=>p.classList.add('hidden'));
    $$('.popover-open', root).forEach(c=>c.classList.remove('popover-open'));
  }, {once:true});
}
function kpiCard({id,icon,label,value,tone,tooltip,hero,share,foot},idx){
  const t = tone||'';
  const delay = (idx!==undefined? (idx*0.03).toFixed(2) : 0);
  if(hero){
    return `<div class="kpi-card kpi-hero ${id?'clickable':''}" data-tone="${t}" ${id?`data-kpi="${id}"`:''} style="animation-delay:${delay}s">
      <div class="kpi-accent" style="background:${TONE_FG[t]}"></div>
      <div class="kpi-top"><div class="kpi-icon" style="background:${TONE_BG[t]};color:${TONE_FG[t]}">${ICONS[icon]||''}</div>${infoIcon(tooltip||'')}</div>
      <div class="kpi-hero-mid">
        <div class="kpi-value">${value}</div>
        <div class="kpi-label">${esc(label)}</div>
        ${share||''}
      </div>
      ${foot||''}
    </div>`;
  }
  return `<div class="kpi-card ${id?'clickable':''}" data-tone="${t}" ${id?`data-kpi="${id}"`:''} style="animation-delay:${delay}s">
    <div class="kpi-accent" style="background:${TONE_FG[t]}"></div>
    <div class="kpi-top"><div class="kpi-icon" style="background:${TONE_BG[t]};color:${TONE_FG[t]}">${ICONS[icon]||''}</div>${infoIcon(tooltip||'')}</div>
    <div class="kpi-value">${value}</div>
    <div class="kpi-label">${esc(label)}</div>
  </div>`;
}

/* ==========================================================================

   1) Padrão visual único para os tooltips do Chart.js, com modo de interação
      por índice — basta passar o mouse pela coluna, não é preciso acertar a
      barra exata.
   2) Tooltip próprio para os visuais em HTML (funil, heatmap, barras de carga,
      composição, listas), acionado por [data-tip].
   3) O ícone "i" passa a abrir no hover, além do clique (que segue valendo
      para telas de toque).
   ========================================================================== */
(function configurarTooltipsDeGrafico(){
  if(typeof Chart === 'undefined') return;
  const T = Chart.defaults.plugins.tooltip;
  T.enabled = true;
  T.backgroundColor = 'rgba(30,32,34,.96)';
  T.titleColor = '#FFFFFF';
  T.bodyColor  = 'rgba(255,255,255,.88)';
  T.footerColor= 'rgba(255,255,255,.62)';
  T.borderColor= 'rgba(172,0,0,.55)';
  T.borderWidth= 1;
  T.cornerRadius = 9;
  T.padding = {top:9, right:12, bottom:9, left:12};
  T.titleFont = {family:"'Manrope',sans-serif", size:12.5, weight:'800'};
  T.bodyFont  = {family:"'Manrope',sans-serif", size:12, weight:'600'};
  T.footerFont= {family:"'Manrope',sans-serif", size:10.5, weight:'700'};
  T.displayColors = true;
  T.boxWidth = 9; T.boxHeight = 9; T.boxPadding = 5;
  T.usePointStyle = true;
  Chart.defaults.font.family = "'Manrope',sans-serif";
  Chart.defaults.interaction = {mode:'index', intersect:false};
  Chart.defaults.hover = {mode:'index', intersect:false};
})();

/* Opções compartilhadas: aplicadas a todo gráfico criado no painel. */
/* Valor correto conforme a orientação do gráfico: em barra horizontal
   (indexAxis:'y') o dado fica em parsed.x; em barra/linha vertical, em parsed.y. */
function valorDoPonto(c){
  const horizontal = (c.chart.options.indexAxis === 'y');
  const v = horizontal ? c.parsed.x : c.parsed.y;
  return (v===null || v===undefined || isNaN(v)) ? 0 : v;
}
/* Lista de títulos das demandas, usada nos tooltips. */
const TITULOS_MAX = 6;
function listaTitulos(arr, max){
  const n = max || TITULOS_MAX;
  if(!arr || !arr.length) return [];
  const linhas = arr.slice(0, n).map(d=> '• ' + (d.id? d.id+' — ':'') + (d.titulo||'(sem título)'));
  if(arr.length > n) linhas.push('… e mais ' + (arr.length - n));
  return linhas;
}
function listaTitulosHTML(arr, max){
  const l = listaTitulos(arr, max);
  return l.length ? '<br>' + l.map(esc).join('<br>') : '';
}

function chartTooltip({total, unidade='demandas', clicavel=true, percentual=true, formatar, itens}){
  return {
    callbacks:{
      label:(c)=>{
        const v = valorDoPonto(c);
        if(formatar) return formatar(c, v);
        const base = (c.dataset.label? c.dataset.label+': ' : '') + fmtNum(v) + ' ' + unidade;
        if(percentual && total) return base + '  ·  ' + pct(v/total);
        return base;
      },
      /* Nomes das demandas daquele ponto do gráfico. */
      afterBody: itens? (its)=>{
        if(!its.length) return [];
        const arr = itens(its[0].dataIndex, its[0]);
        return listaTitulos(arr);
      } : undefined,
      footer: clicavel? ()=> 'Clique para abrir a lista filtrada' : undefined
    }
  };
}
/* Cursor de mão e realce ao passar sobre qualquer gráfico clicável. */
function hoverPointer(e, els){ e.native.target.style.cursor = els.length? 'pointer' : 'default'; }

/* -------- Tooltip próprio para os visuais em HTML -------- */
let _tipEl = null;
function ensureTipEl(){
  if(_tipEl) return _tipEl;
  _tipEl = document.createElement('div');
  _tipEl.className = 'hover-tip hidden';
  document.body.appendChild(_tipEl);
  return _tipEl;
}
function showTip(html, x, y){
  const el = ensureTipEl();
  el.innerHTML = html;
  el.classList.remove('hidden');
  const r = el.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 12;
  if(left + r.width > window.innerWidth - 10) left = x - r.width - 14;
  if(top < 8) top = y + 18;
  el.style.left = Math.max(8,left) + 'px';
  el.style.top  = top + 'px';
}
function hideTip(){ if(_tipEl) _tipEl.classList.add('hidden'); }

/* Delegação global: qualquer elemento com [data-tip] ganha tooltip no hover. */
document.addEventListener('mouseover', (e)=>{
  const alvo = e.target.closest && e.target.closest('[data-tip]');
  if(alvo) showTip(alvo.getAttribute('data-tip'), e.clientX, e.clientY);
});
document.addEventListener('mousemove', (e)=>{
  const alvo = e.target.closest && e.target.closest('[data-tip]');
  if(alvo) showTip(alvo.getAttribute('data-tip'), e.clientX, e.clientY);
  else hideTip();
});
document.addEventListener('mouseleave', hideTip);
window.addEventListener('scroll', hideTip, true);

/* Cálculo dos cards de "Números Gerais" — extraído para função própria para que
   o mesmo bloco de indicadores possa ser reaproveitado tanto na tela (Dashboard/
   Visão Geral, interativo) quanto no PDF executivo (estático). */
function buildKPIsOperacionais(filtered){
  const ativos = filtered.filter(d=>!STATUS_FINAIS.includes(d.status));

  const atrasadas = filtered.filter(d=>d.atrasada).length;
  const venceEm7 = filtered.filter(d=> !STATUS_FINAIS.includes(d.status) && d.diasParaPublicacao!==null && d.diasParaPublicacao>=0 && d.diasParaPublicacao<=7).length;
  const comSla = filtered.filter(d=>d.sla!=='N/A');
  const dentroSla = comSla.filter(d=>d.sla==='Dentro').length;
  const pctSla = comSla.length? Math.round(dentroSla/comSla.length*100): null;
  const criticasAbertas = filtered.filter(d=> d.prioridade==='P1 – Crítica' && !STATUS_FINAIS.includes(d.status)).length;
  const backlogEstrito = filtered.filter(d=>d.status==='Backlog').length;
  const bloqueadas = filtered.filter(d=>d.status==='Bloqueada').length;

  const concluidasTotal = filtered.filter(d=>d.status==='Concluída');
  const comSlaConcluidasTotal = concluidasTotal.filter(d=>d.sla!=='N/A');
  const pctNoPrazoTotal = comSlaConcluidasTotal.length? Math.round(comSlaConcluidasTotal.filter(d=>d.sla==='Dentro').length/comSlaConcluidasTotal.length*100) : null;

  const cardsTop = [
    {icon:'inbox', label:'Total de Demandas', value:filtered.length, tooltip:'Total de registros na base, considerando os filtros aplicados — independentemente do status.', id:'totalGeral'},
    {icon:'check', label:'Concluídas', value:concluidasTotal.length, tooltip:'Demandas com status = Concluída, considerando toda a carteira filtrada (sem restrição de período). Fecha a esteira: Total → Concluídas → Em Aberto.', tone:'ok', id:'concluidasTotal'},
    {icon:'target', label:'Concluídas dentro do prazo', value: pctNoPrazoTotal!==null? pctNoPrazoTotal+'%':'—', tooltip:'Percentual das demandas concluídas (mesmo grupo do card ao lado) cujo lead time ficou dentro do SLA da prioridade.', tone: pctNoPrazoTotal!==null&&pctNoPrazoTotal<80?'crit':'ok', id: pctNoPrazoTotal!==null?'concluidasTotal':null}
  ];

  /* --- composição do card de destaque "Demandas em Aberto" --- */
  const emExecucao = ativos.filter(d=> d.status==='Em andamento' || d.status==='Em análise').length;
  const aguardando = ativos.filter(d=> (d.status||'').indexOf('Aguardando')===0).length;
  const outrosAbertos = Math.max(0, ativos.length - backlogEstrito - emExecucao - aguardando - bloqueadas);
  const shareAberto = filtered.length? Math.round(ativos.length/filtered.length*100) : 0;
  const heroSegs = [
    {lbl:'Em fila',      n:backlogEstrito, cor:'var(--gray-500)', itens: ativos.filter(d=>d.status==='Backlog')},
    {lbl:'Em execução',  n:emExecucao,     cor:'var(--info)',     itens: ativos.filter(d=> d.status==='Em andamento' || d.status==='Em análise')},
    {lbl:'Aguardando',   n:aguardando,     cor:'var(--wait)',     itens: ativos.filter(d=> (d.status||'').indexOf('Aguardando')===0)},
    {lbl:'Bloqueadas',   n:bloqueadas,     cor:'var(--crit)',     itens: ativos.filter(d=>d.status==='Bloqueada')},
    {lbl:'Outros',       n:outrosAbertos,  cor:'var(--gray-300)', itens: []}
  ].filter(s=> s.n>0);
  const heroTot = heroSegs.reduce((a,s)=>a+s.n,0) || 1;
  const heroShare = `<div class="kpi-hero-share"><b>${shareAberto}%</b> do total filtrado (${fmtNum(filtered.length)} registros)</div>`;
  const heroFoot = ativos.length
    ? `<div class="kpi-hero-foot">
        <div class="cap">Composição da carteira em aberto</div>
        <div class="kpi-hero-bar">${heroSegs.map(s=>`<span style="width:${(s.n/heroTot*100).toFixed(1)}%;background:${s.cor}" data-tip="<b>${esc(s.lbl)}</b><br>${s.n} de ${heroTot} demanda${heroTot===1?'':'s'} em aberto · ${pct(s.n/heroTot)}${listaTitulosHTML(s.itens)}"></span>`).join('')}</div>
        <div class="kpi-hero-legend">${heroSegs.map(s=>`<span class="it" data-tip="<b>${esc(s.lbl)}</b><br>${s.n} de ${heroTot} em aberto · ${pct(s.n/heroTot)}${listaTitulosHTML(s.itens)}"><i style="background:${s.cor}"></i>${esc(s.lbl)} <b>${s.n}</b></span>`).join('')}</div>
      </div>`
    : `<div class="kpi-hero-foot"><div class="cap">Composição da carteira em aberto</div><div class="kpi-hero-legend"><span class="it">Nenhuma demanda em aberto no recorte atual.</span></div></div>`;

  const cards = [
    {icon:'layers', label:'Demandas Abertas', value:ativos.length, tooltip:'Demandas com status diferente de Concluída/Cancelada. A composição abaixo distribui essas demandas pelos estágios em aberto.', id:'ativas', hero:true, share:heroShare, foot:heroFoot},
    {icon:'list', label:'Em fila (Backlog)', value:backlogEstrito, tooltip:'Demandas com status = Backlog: ainda não triadas/iniciadas. Diferente de "Demandas Abertas", que soma todos os estágios em aberto.', id:'backlog'},
    {icon:'alert', label:'Atrasadas', value:atrasadas, tooltip:'Data Planejada de Publicação vencida e status ainda não final.', tone: atrasadas>0?'crit':'', id:'atrasadas'},
    {icon:'clock', label:'Vencem em até 7 dias', value:venceEm7, tooltip:'Dias úteis até a Data Planejada de Publicação entre 0 e 7.', tone: venceEm7>0?'warn':'', id:'vence7'},
    {icon:'lock', label:'Bloqueadas', value:bloqueadas, tooltip:'Status = Bloqueada.', tone: bloqueadas>0?'warn':'', id:'bloqueadas'},
    {icon:'fire', label:'Críticas em aberto (P1)', value:criticasAbertas, tooltip:'Prioridade P1 – Crítica ainda não concluída/cancelada.', tone: criticasAbertas>0?'crit':'', id:'criticas'},
    {icon:'target', label:'% dentro do SLA', value: pctSla!==null? pctSla+'%':'—', tooltip:'SLA calculado por prioridade (dias úteis), considerando toda a carteira filtrada.', tone: pctSla!==null&&pctSla<80?'crit':'ok', id: pctSla!==null?'slaDentro':null}
  ];

  return {cardsTop, cards};
}

function renderKPIsOperacional(filtered){
  const gridTop = $('#kpiGridOpTop');
  const grid = $('#kpiGridOp');
  const {cardsTop, cards} = buildKPIsOperacionais(filtered);

  gridTop.innerHTML = cardsTop.map((c,i)=>kpiCard(c,i)).join('');
  bindInfoIcons(gridTop);
  $$('.kpi-card[data-kpi]', gridTop).forEach(el=> el.onclick = (e)=>{ if(e.target.closest('[data-info-toggle]')) return; handleKpiClick(el.dataset.kpi); });

  grid.innerHTML = cards.map((c,i)=>kpiCard(c,i)).join('');
  bindInfoIcons(grid);
  $$('.kpi-card[data-kpi]', grid).forEach(el=> el.onclick = (e)=>{ if(e.target.closest('[data-info-toggle]')) return; handleKpiClick(el.dataset.kpi); });
}

/* ==========================================================================
   COMUNICAÇÃO & PERFORMANCE
   As 10 métricas de resultado (alcance, visualizações, curtidas, comentários,
   cliques, compartilhamentos, ações/conversões e as três taxas derivadas)
   são consolidadas aqui em três blocos com lógicas distintas:
     1) FUNIL  — métricas de volume que se encadeiam (alcance → visualizações
        → cliques → ações). Lidas em cascata, com a perda de cada etapa.
     2) INTERAÇÕES — métricas de reação que NÃO se encadeiam (curtidas,
        comentários, compartilhamentos). Lidas como composição do engajamento.
     3) TAXAS — indicadores relativos, consolidados sobre o total (e não como
        média simples entre peças, que distorce quando o alcance varia muito).
   Base de cálculo: apenas peças já mensuradas (alcance > 0). Incluir peças
   não publicadas zeraria as taxas e criaria falsa impressão de queda.
   ========================================================================== */
function renderPerformanceBlock(filtered){
  const medidas = filtered.filter(d=>Number(d.alcance)>0);
  const S = k => medidas.reduce((a,d)=>a+(Number(d[k])||0),0);

  const alcance   = S('alcance');
  const views     = S('visualizacoes');
  const cliques   = S('cliques');
  const acoes     = S('acoesConversoes');
  const curtidas  = S('curtidas');
  const coment    = S('comentarios');
  const compart   = S('compartilhamentos');
  const interacoes = curtidas + coment + compart;

  const tView = alcance? views/alcance : 0;
  const tEng  = alcance? interacoes/alcance : 0;
  const tCliq = alcance? cliques/alcance : 0;
  const tConv = cliques? acoes/cliques : 0;

  /* Média simples por peça — mantida como contraponto no tooltip. */
  const avg = (fn)=> medidas.length? medidas.reduce((a,d)=>a+fn(d),0)/medidas.length : 0;
  const tEngAvg  = avg(d=>d.taxaEngajamento);
  const tCliqAvg = avg(d=>d.taxaClique);
  const tConvAvg = avg(d=>d.taxaConversao);

  const note = $('#perfBaseNote');
  if(note) note.textContent = medidas.length
    ? `base: ${fmtNum(medidas.length)} peça${medidas.length>1?'s':''} mensurada${medidas.length>1?'s':''} de ${fmtNum(filtered.length)} no recorte`
    : 'nenhuma peça mensurada no recorte atual';

  /* ---------- Cards de volume ---------- */
  const volCards = [
    {icon:'eye2',  label:'Alcance',           value:fmtNum(alcance), tooltip:'Soma do público impactado pelas peças mensuradas. É o topo do funil e a base de todas as taxas.', id:'mensuradas'},
    {icon:'eye',   label:'Visualizações',     value:fmtNum(views),   tooltip:'Quantas vezes o conteúdo foi efetivamente aberto/visto. Nem toda peça registra visualização — eventos e reuniões, por exemplo, medem adesão direta.', id:'mensuradas'},
    {icon:'click', label:'Cliques',           value:fmtNum(cliques), tooltip:'Cliques no CTA ou nos links da comunicação. Mede intenção, não resultado.', id:'comCliques'},
    {icon:'check', label:'Ações/Conversões',  value:fmtNum(acoes),   tooltip:'Ações concluídas: inscrições, adesões, presenças, respostas. É o resultado que a comunicação existia para gerar.', tone:'ok', id:'comConversao'}
  ];
  const gv = $('#kpiGridPerfVol');
  gv.innerHTML = volCards.map((c,i)=>kpiCard(c,i)).join('');
  bindInfoIcons(gv);
  $$('.kpi-card[data-kpi]', gv).forEach(el=> el.onclick = (e)=>{ if(e.target.closest('[data-info-toggle]')) return; handleKpiClick(el.dataset.kpi); });

  /* ---------- Funil ---------- */
  const etapas = [
    {lbl:'Alcance',          n:alcance, cor:'linear-gradient(90deg,#5C6167,#3B3F43)'},
    {lbl:'Visualizações',    n:views,   cor:'linear-gradient(90deg,#3A6EA5,#2C5480)'},
    {lbl:'Cliques',          n:cliques, cor:'linear-gradient(90deg,#C41111,#AC0000)'},
    {lbl:'Ações/Conversões', n:acoes,   cor:'linear-gradient(90deg,#1E8E5A,#146B43)'}
  ];
  const fb = $('#funnelBody');
  if(!alcance){
    fb.innerHTML = emptyState('Sem peças mensuradas no recorte atual.');
  } else {
    fb.innerHTML = etapas.map((e,i)=>{
      const w = Math.max(alcance? (e.n/alcance*100) : 0, e.n>0? 2.5 : 0);
      const ant = i>0? etapas[i-1].n : null;
      const conv = (ant!==null && ant>0)? e.n/ant : null;
      const perda = conv!==null? 1-conv : null;
      return `<div class="funnel-step">
        <div class="fs-head"><span class="fs-lbl">${esc(e.lbl)}</span><span class="fs-val">${fmtNum(e.n)}<i>${alcance? pct(e.n/alcance):'—'} do alcance</i></span></div>
        <div class="fs-track" data-tip="<b>${esc(e.lbl)}</b><br>${fmtNum(e.n)} · ${alcance? pct(e.n/alcance):'—'} do alcance${conv!==null? '<br>'+pct(conv)+' avançaram de '+esc(etapas[i-1].lbl).toLowerCase()+' · perda de '+pct(perda):''}"><div class="fs-fill" style="width:${w.toFixed(2)}%;background:${e.cor}"></div></div>
        ${conv!==null? `<div class="fs-conv"><span class="arw">↳</span> <b>${pct(conv)}</b> avançaram de ${esc(etapas[i-1].lbl).toLowerCase()} · perda de ${pct(perda)}</div>`:''}
      </div>`;
    }).join('');
  }

  /* ---------- Interações ---------- */
  const inter = [
    {lbl:'Curtidas/Reações',  n:curtidas, cor:'var(--info)',  hint:'reação de baixo esforço'},
    {lbl:'Comentários',       n:coment,   cor:'var(--warn)',  hint:'conversa gerada'},
    {lbl:'Compartilhamentos', n:compart,  cor:'var(--red)',   hint:'endosso — o sinal mais forte'}
  ];
  const maxInter = Math.max(...inter.map(i=>i.n), 1);
  const porMil = alcance? (interacoes/alcance*1000) : 0;
  const ib = $('#interacoesBody');
  ib.innerHTML = !alcance
    ? emptyState('Sem peças mensuradas no recorte atual.')
    : `<div class="inter-hero">
         <div class="ih-v">${fmtNum(interacoes)}</div>
         <div class="ih-k">interações no total</div>
         <div class="ih-x">${porMil.toFixed(1)} a cada 1.000 pessoas alcançadas</div>
       </div>
       <div class="inter-list">${inter.map(it=>`
         <div class="inter-row">
           <div class="ir-top"><span class="ir-lbl"><i style="background:${it.cor}"></i>${esc(it.lbl)}</span><span class="ir-n">${fmtNum(it.n)}</span></div>
           <div class="ir-track" data-tip="<b>${esc(it.lbl)}</b><br>${fmtNum(it.n)} · ${interacoes? pct(it.n/interacoes):'—'} das interações<br>${alcance? (it.n/alcance*1000).toFixed(1)+' a cada 1.000 alcançados':''}<br><i>${esc(it.hint)}</i>"><div class="ir-fill" style="width:${(it.n/maxInter*100).toFixed(2)}%;background:${it.cor}"></div></div>
           <div class="ir-sub">${interacoes? pct(it.n/interacoes):'—'} das interações · ${esc(it.hint)}</div>
         </div>`).join('')}</div>`;

  /* ---------- Taxas ---------- */
  const taxaCards = [
    {icon:'eye',    label:'Taxa de visualização', value: alcance? pct(tView):'—', tooltip:'Visualizações ÷ Alcance. Mede se a peça chamou atenção o suficiente para ser aberta.', tone: alcance&&tView<0.4?'warn':'ok', id:null},
    {icon:'target', label:'Taxa de engajamento',  value: alcance? pct(tEng):'—',  tooltip:`(Curtidas + Comentários + Compartilhamentos) ÷ Alcance, consolidado. Média simples entre peças: ${pct(tEngAvg)}.`, tone: alcance&&tEng<0.02?'warn':'ok', id:null},
    {icon:'click',  label:'Taxa de clique',       value: alcance? pct(tCliq):'—', tooltip:`Cliques ÷ Alcance, consolidado. Média simples entre peças: ${pct(tCliqAvg)}.`, tone: alcance&&tCliq<0.05?'warn':'ok', id:'comCliques'},
    {icon:'check',  label:'Taxa de conversão',    value: cliques? pct(tConv):'—', tooltip:`Ações/Conversões ÷ Cliques, consolidado. Mede quantos dos interessados concluíram a ação. Média simples entre peças: ${pct(tConvAvg)}.`, tone: cliques&&tConv<0.1?'warn':'ok', id:'comConversao'}
  ];
  const gt = $('#kpiGridPerfTaxas');
  gt.innerHTML = taxaCards.map((c,i)=>kpiCard(c,i)).join('');
  bindInfoIcons(gt);
  $$('.kpi-card[data-kpi]', gt).forEach(el=> el.onclick = (e)=>{ if(e.target.closest('[data-info-toggle]')) return; handleKpiClick(el.dataset.kpi); });
}

function renderKPIsEditorial(filtered){

  const grid = $('#kpiGridEd');
  const publicadas = filtered.filter(d=>STATUS_EDITORIAL_PUBLICADO_OU_POSTERIOR.includes(d.statusEditorial)).length;
  const emProducao = filtered.filter(d=>d.statusEditorial==='Em produção').length;
  const aguardApr = filtered.filter(d=>d.statusEditorial==='Aguardando aprovação').length;
  const comAlerta = filtered.filter(d=>d.alertaEditorial).length;
  const semMensuracao = filtered.filter(d=>STATUS_EDITORIAL_PUBLICADO_OU_POSTERIOR.includes(d.statusEditorial) && !(Number(d.alcance)>0)).length;

    {icon:'clock', label:'Em produção', value:emProducao, tooltip:'Status Editorial = Em produção (ainda não publicada).', id:'emProducao'},
    {icon:'users', label:'Aguardando aprovação', value:aguardApr, tooltip:'Status Editorial = Aguardando aprovação. Dependem de decisão de gestor/diretoria antes de seguir para produção/publicação.', tone: aguardApr>0?'warn':'', id:'aguardandoAprovacaoEd'},

    {icon:'eye2', label:'Publicadas sem mensuração', value:semMensuracao, tooltip:'Peças que já foram ao ar mas ainda estão com alcance zerado. Elas ficam de fora do funil de performance e das taxas — preencher os números libera a leitura completa do desempenho.', tone: semMensuracao>0?'warn':'', id:'semMensuracao'},
    {icon:'trend', label:'Lead time médio', value: leadMedioEd!=='—'? leadMedioEd+' du':'—', tooltip:'Dias úteis médios entre a solicitação e a conclusão — mede a agilidade ponta a ponta do processo.', id: leadMedioEd!=='—'?'leadTime':null}
  ];

  bindInfoIcons(grid);
  $$('.kpi-card[data-kpi]', grid).forEach(el=> el.onclick = (e)=>{ if(e.target.closest('[data-info-toggle]')) return; handleKpiClick(el.dataset.kpi); });

function handleKpiClick(id){
  switch(id){
    case 'totalGeral': state._specialFilter=null; break;
    case 'ativas': state._specialFilter=null; state.filters.status=activeLists().status.filter(s=>!STATUS_FINAIS.includes(s)); break;
    case 'concluidasTotal': state._specialFilter=null; state.filters.status=['Concluída']; break;
    case 'concluidasPeriodo': state._specialFilter=null; state.filters.status=['Concluída']; break;
    case 'atrasadas': state._specialFilter={atrasadaOnly:true}; break;
    case 'vence7': state._specialFilter={vence7Only:true}; break;
    case 'slaDentro': state._specialFilter={predicate:d=>d.sla==='Fora'}; break;
    case 'leadTime': state._specialFilter={predicate:d=>d.leadTime!==null}; break;
    case 'criticas': state._specialFilter={predicate:d=>d.prioridade==='P1 – Crítica' && !STATUS_FINAIS.includes(d.status)}; state.filters.prioridade=['P1 – Crítica']; break;
    case 'backlog': state._specialFilter=null; state.filters.status=['Backlog']; break;
    case 'bloqueadas': state._specialFilter=null; state.filters.status=['Bloqueada']; break;
    case 'publicadas': state.filters.statusEditorial=[]; state._specialFilter={predicate:d=>STATUS_EDITORIAL_PUBLICADO_OU_POSTERIOR.includes(d.statusEditorial)}; break;
    case 'emProducao': state._specialFilter=null; state.filters.statusEditorial=['Em produção']; break;
    case 'mensuradas': state._specialFilter={predicate:d=>Number(d.alcance)>0}; break;
    case 'comCliques': state._specialFilter={predicate:d=>Number(d.cliques)>0}; break;
    case 'comConversao': state._specialFilter={predicate:d=>Number(d.acoesConversoes)>0}; break;
    case 'semMensuracao': state._specialFilter={predicate:d=>STATUS_EDITORIAL_PUBLICADO_OU_POSTERIOR.includes(d.statusEditorial) && !(Number(d.alcance)>0)}; break;
    case 'aguardandoAprovacaoEd': state._specialFilter=null; state.filters.statusEditorial=['Aguardando aprovação']; break;
    case 'comAlerta': state._specialFilter={comAlertaOnly:true}; break;
  }
  goToDemandas();
}

function renderRespChart(filtered){
  const el = $('#respChart');
  const ativos = filtered.filter(d=>!STATUS_FINAIS.includes(d.status));
  if(!ativos.length){ el.innerHTML = emptyState('Nenhuma demanda ativa para os filtros selecionados.'); return; }
  const byResp = {};
  ativos.forEach(d=>{
    const r = d.responsavel || '(sem responsável)';
    if(!byResp[r]) byResp[r] = {total:0, esforco:0, atrasadas:0, criticas:0, statuses:{}, itens:{}, todas:[]};
    byResp[r].total++;
    byResp[r].esforco += Number(d.esforco)||0;
    if(d.atrasada) byResp[r].atrasadas++;
    if(d.prioridade==='P1 – Crítica') byResp[r].criticas++;
    let key = d.status==='Bloqueada'?'Bloqueada': d.atrasada?'Atrasada': (d.status==='Em andamento'?'Em andamento': d.status==='Em análise'?'Em análise': (d.status.startsWith('Aguardando')?'Aguardando':'Outro'));
    byResp[r].statuses[key] = (byResp[r].statuses[key]||0)+1;
    (byResp[r].itens[key] = byResp[r].itens[key] || []).push(d);
    byResp[r].todas.push(d);
  });
  const maxTotal = Math.max(...Object.values(byResp).map(x=>x.total),1);
  const entries = Object.entries(byResp).sort((a,b)=>b[1].total-a[1].total);
  const segOrder = ['Em andamento','Em análise','Aguardando','Bloqueada','Atrasada','Outro'];
  let html = entries.map(([resp,info])=>{
    const segs = segOrder.filter(s=>info.statuses[s]).map(s=>{
      const w = info.statuses[s]/info.total*100;
      return `<div class="resp-bar-seg" style="width:${w}%;background:${RESP_STATUS_COLORS[s]}" data-tip="<b>${esc(resp)} · ${esc(s)}</b><br>${info.statuses[s]} de ${info.total} demanda${info.total===1?'':'s'} (${pct(info.statuses[s]/info.total)})${listaTitulosHTML(info.itens[s])}"></div>`;
    }).join('');
    const overload = info.total >= maxTotal*0.8 && info.total>3;
    return `<div class="resp-row" data-resp="${esc(resp)}" data-tip="<b>${esc(resp)}</b><br>${info.total} demanda${info.total===1?'':'s'} em aberto · ${info.esforco} pts de esforço<br>${info.atrasadas} atrasada${info.atrasadas===1?'':'s'} · ${info.criticas} crítica${info.criticas===1?'':'s'} (P1)${overload?'<br><b>Possível sobrecarga</b>':''}${listaTitulosHTML(info.todas)}<br><i>Clique para abrir as demandas</i>">
      <div class="resp-row-head"><span>${esc(resp)}</span><span class="meta">${info.total} demandas · ${info.esforco} pts${overload?' · possível sobrecarga':''}</span></div>
      <div class="resp-bar-track">${segs}</div>
    </div>`;
  }).join('');
  html += `<div class="resp-legend">${segOrder.map(s=>`<span><span class="legend-dot" style="background:${RESP_STATUS_COLORS[s]}"></span>${s}</span>`).join('')}</div>`;
  el.innerHTML = html;
  $$('.resp-row', el).forEach(r=> r.onclick = ()=>{
    state.filters.responsavel = [r.dataset.resp];
    state._specialFilter = {predicate:d=>!STATUS_FINAIS.includes(d.status)};
    goToDemandas();
  });
}

function renderEntradasChart(filtered){
  const months = lastNMonthsKeys(6);
  const entradas = {}, concluidas = {};
  months.forEach(m=>{entradas[m]=0;concluidas[m]=0;});
  state.demandas.forEach(d=>{
    if(!applyFilters([d]).length) return;
    if(d._dSol){ const k = monthKey(d._dSol); if(k in entradas) entradas[k]++; }
    if(d._dConc){ const k = monthKey(d._dConc); if(k in concluidas) concluidas[k]++; }
  });
  const labels = months.map(m=>m.split('-')[1]+'/'+m.split('-')[0].slice(2));
  const dataEnt = months.map(m=>entradas[m]);
  const dataConc = months.map(m=>concluidas[m]);
  const totalEnt = dataEnt.reduce((a,b)=>a+b,0), totalConc = dataConc.reduce((a,b)=>a+b,0);
  $('#entregaInterp').textContent = totalEnt>totalConc ? 'Possível crescimento de backlog.' : (totalConc>totalEnt ? 'Carteira apresentando tendência de redução.' : 'Entradas e entregas equilibradas no período.');
  destroyChart('entradas');
  const ctx = $('#chartEntradas');
  if(!ctx) return;
  state.charts.entradas = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[
      {label:'Recebidas', data:dataEnt, borderColor:'#50555A', backgroundColor:'rgba(80,85,90,.08)', tension:.3, fill:true, pointRadius:3},
      {label:'Concluídas', data:dataConc, borderColor:'#AC0000', backgroundColor:'rgba(172,0,0,.08)', tension:.3, fill:true, pointRadius:3}
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11}}},
        tooltip:{callbacks:{
          title:(its)=> 'Mês de '+its[0].label,
          label:(c)=>{ const v=valorDoPonto(c); return `${c.dataset.label}: ${fmtNum(v)} demanda${v===1?'':'s'}`; },
          afterBody:(its)=>{
            const mk = months[its[0].dataIndex];
            const rec = state.demandas.filter(d=> applyFilters([d]).length && d._dSol && monthKey(d._dSol)===mk);
            const con = state.demandas.filter(d=> applyFilters([d]).length && d._dConc && monthKey(d._dConc)===mk);
            const out=[];
            if(rec.length){ out.push('Recebidas:'); out.push(...listaTitulos(rec,4)); }
            if(con.length){ if(out.length) out.push(''); out.push('Concluídas:'); out.push(...listaTitulos(con,4)); }
            return out;
          },
          footer:(its)=>{ const rec=its.find(i=>i.dataset.label==='Recebidas'), con=its.find(i=>i.dataset.label==='Concluídas');
            if(!rec||!con) return '';
            const s = rec.parsed.y - con.parsed.y;
            return s>0? `Saldo do mês: +${s} (backlog cresceu)` : s<0? `Saldo do mês: ${s} (backlog reduziu)` : 'Saldo do mês: equilibrado'; }
        }}},
      scales:{y:{beginAtZero:true,ticks:{precision:0}}} }
  });
}
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function lastNMonthsKeys(n){
  const arr=[]; const t = new Date(); t.setDate(1);
  for(let i=n-1;i>=0;i--){ const d = new Date(t.getFullYear(), t.getMonth()-i, 1); arr.push(monthKey(d)); }
  return arr;
}

function renderHeatmap(filtered){
  const el = $('#heatmapWrap');
  const prios = ['P1 – Crítica','P2 – Alta','P3 – Média','P4 – Baixa'];
  const abertas = filtered.filter(d=>!STATUS_FINAIS.includes(d.status));
  const matrix = prios.map(p=> AGING_BUCKETS.map(b=> abertas.filter(d=>d.prioridade===p && d.aging===b).length));
  const max = Math.max(...matrix.flat(),1);
  function colorFor(prioIdx,val){
    if(val===0) return '';
    const intensity = 0.15 + 0.75*(val/max);
    const isCrit = prioIdx<=1;
    const rgb = isCrit? `172,0,0` : `183,106,0`;
    return `background:rgba(${rgb},${intensity.toFixed(2)});color:${intensity>0.5?'#fff':'#2B2E31'}`;
  }
  el.innerHTML = `<table class="heatmap"><thead><tr><th></th>${AGING_BUCKETS.map(b=>`<th>${b}</th>`).join('')}</tr></thead><tbody>
    ${prios.map((p,pi)=>`<tr><td class="rowlabel" data-tip="<b>${esc(p)}</b><br>${matrix[pi].reduce((a,b)=>a+b,0)} demanda(s) em aberto${listaTitulosHTML(abertas.filter(x=>x.prioridade===p))}">${p}</td>${matrix[pi].map((v,bi)=>`<td class="${v===0?'z0':''}" style="${colorFor(pi,v)}" data-p="${p}" data-b="${AGING_BUCKETS[bi]}" data-tip="<b>${esc(p)}</b> · ${esc(AGING_BUCKETS[bi])}<br>${v} demanda${v===1?'':'s'} em aberto${abertas.length? ' · '+pct(v/abertas.length)+' das abertas':''}${v? listaTitulosHTML(abertas.filter(x=>x.prioridade===p && x.aging===AGING_BUCKETS[bi])) : ''}${v?'<br><i>Clique para abrir a lista</i>':''}">${v||'–'}</td>`).join('')}</tr>`).join('')}
  </tbody></table>`;
  $$('td[data-p]', el).forEach(td=> td.onclick = ()=>{
    if(td.classList.contains('z0')) return;
    state._specialFilter = {agingBucket: td.dataset.b};
    state.filters.prioridade = [td.dataset.p];
    goToDemandas();
  });
}

function computeInsightMessages(filtered){
  const msgs = [];
  const ativos = filtered.filter(d=>!STATUS_FINAIS.includes(d.status));
  if(ativos.length){
    const byResp = {};
    ativos.forEach(d=> byResp[d.responsavel]=(byResp[d.responsavel]||0)+1);
    const top = Object.entries(byResp).sort((a,b)=>b[1]-a[1])[0];
    if(top){ const p = Math.round(top[1]/ativos.length*100); msgs.push(`${top[0]} possui a maior carteira ativa, com ${p}% das demandas abertas.`); }
  }
  const vence7 = filtered.filter(d=>!STATUS_FINAIS.includes(d.status) && d.diasParaPublicacao!==null && d.diasParaPublicacao>=0 && d.diasParaPublicacao<=7).length;
  if(vence7>0) msgs.push(`${vence7} demanda${vence7>1?'s':''} vence${vence7>1?'m':''} nos próximos 7 dias úteis.`);
  const cats = activeLists().editorias;
  const mAtual = monthKey(today()); const mAnt = monthKey(new Date(today().getFullYear(), today().getMonth()-1,1));
  let bestCat=null,bestGrowth=-Infinity;
  cats.forEach(cat=>{
    const atual = state.demandas.filter(d=>d.editoria===cat && d._dSol && monthKey(d._dSol)===mAtual).length;
    const ant = state.demandas.filter(d=>d.editoria===cat && d._dSol && monthKey(d._dSol)===mAnt).length;
    if(ant>0){ const g = (atual-ant)/ant; if(g>bestGrowth && atual>=ant && atual>0){ bestGrowth=g; bestCat={cat,g}; } }
  });
  if(bestCat && bestCat.g>0) msgs.push(`${bestCat.cat} apresentou crescimento de ${Math.round(bestCat.g*100)}% no volume de demandas no último mês.`);
  const months = lastNMonthsKeys(2);
  const entAtual = state.demandas.filter(d=>d._dSol && monthKey(d._dSol)===months[1]).length;
  const concAtual = state.demandas.filter(d=>d._dConc && monthKey(d._dConc)===months[1]).length;
  if(entAtual>concAtual) msgs.push(`O backlog pode estar crescendo: entradas (${entAtual}) superaram as entregas (${concAtual}) no mês corrente.`);
  else if(concAtual>entAtual) msgs.push(`A carteira apresenta tendência de redução: entregas (${concAtual}) superaram as entradas (${entAtual}) no mês corrente.`);
  const criticas = filtered.filter(d=>d.prioridade==='P1 – Crítica' && !STATUS_FINAIS.includes(d.status)).length;
  if(criticas>0) msgs.push(`${criticas} demanda${criticas>1?'s':''} crítica${criticas>1?'s':''} (P1) precisa${criticas>1?'m':''} de acompanhamento próximo.`);
  const foraSla = filtered.filter(d=>d.sla==='Fora').length;
  if(foraSla>0) msgs.push(`${foraSla} demanda${foraSla>1?'s':''} está${foraSla>1?'ão':''} fora do SLA definido para sua prioridade.`);
  const comAlerta = filtered.filter(d=>d.alertaEditorial).length;
  if(comAlerta>0) msgs.push(`${comAlerta} comunicação${comAlerta>1?'ões':''} com alerta editorial ativo precisa${comAlerta>1?'m':''} de atenção da governança.`);
  const comAlcance = filtered.filter(d=>Number(d.alcance)>0);
  if(comAlcance.length){ const best = comAlcance.slice().sort((a,b)=>b.taxaEngajamento-a.taxaEngajamento)[0]; msgs.push(`"${best.titulo}" apresentou a maior taxa de engajamento do período (${pct(best.taxaEngajamento)}).`); }
  const canais = {}; filtered.forEach(d=> canais[d.canalPrincipal]=(canais[d.canalPrincipal]||0)+1);
  const topCanal = Object.entries(canais).sort((a,b)=>b[1]-a[1])[0];
  if(topCanal && filtered.length) msgs.push(`${topCanal[0]} é o canal principal mais utilizado, com ${topCanal[1]} comunicação${topCanal[1]>1?'ões':''}.`);
  return msgs;
}

   One Page Report para dar à Visão Geral a mesma leitura executiva,
   mantendo a interatividade do Dashboard: cliques em cards/gráficos
   continuam abrindo o detalhe ou a lista filtrada.)
   ========================================================================== */
function computeResumoExecutivo(list){
  const ativos = list.filter(d=>!STATUS_FINAIS.includes(d.status));
  const atrasadas = list.filter(d=>d.atrasada);
  const t0 = today();
  const mesIni = new Date(t0.getFullYear(), t0.getMonth(), 1);
  const concluidasMes = list.filter(d=> d.status==='Concluída' && d._dConc && d._dConc>=mesIni);
  const cmComSla = concluidasMes.filter(d=>d.sla!=='N/A');
  const pctPrazoMes = cmComSla.length? Math.round(cmComSla.filter(d=>d.sla==='Dentro').length/cmComSla.length*100) : null;
  const comLeadAll = list.filter(d=>d.leadTime!==null);
  const leadMedioAll = comLeadAll.length? (comLeadAll.reduce((a,d)=>a+d.leadTime,0)/comLeadAll.length).toFixed(1) : '—';
  const comSla = list.filter(d=>d.sla!=='N/A');
  const pctSla = comSla.length? Math.round(comSla.filter(d=>d.sla==='Dentro').length/comSla.length*100) : null;
  const decisoes = list.filter(d=> !STATUS_FINAIS.includes(d.status) &&
      (d.status==='Aguardando aprovação' || d.status==='Bloqueada' || d.statusEditorial==='Aguardando aprovação'));
  const medidas = list.filter(d=>Number(d.alcance)>0);
  const SS = k => medidas.reduce((a,d)=>a+(Number(d[k])||0),0);
  const fAlc=SS('alcance'), fCliq=SS('cliques'), fAcao=SS('acoesConversoes');
  const tCliqC = fAlc? fCliq/fAlc : 0;
  const tConvC = fCliq? fAcao/fCliq : 0;
  const comAlerta = list.filter(d=>d.alertaEditorial);

  return `A carteira única de Gente & Cultura totaliza ${fmtNum(list.length)} registros, sendo ${fmtNum(ativos.length)} ativos. `+
    `No mês corrente foram concluídas ${fmtNum(concluidasMes.length)} demanda${concluidasMes.length!==1?'s':''}`+
    `${pctPrazoMes!==null? `, ${pctPrazoMes}% dentro do prazo acordado`:''}, com lead time médio de ${leadMedioAll} dias úteis. `+
    `${atrasadas.length>0? `Há ${atrasadas.length} demanda${atrasadas.length>1?'s':''} atrasada${atrasadas.length>1?'s':''} que exige${atrasadas.length>1?'m':''} atenção imediata` : 'Não há demandas atrasadas no momento'}, `+
    `${pctSla!==null? `e o cumprimento de SLA está em ${pctSla}%` : 'sem histórico suficiente para cálculo de SLA'}. `+
    `${decisoes.length>0? `${decisoes.length} iten${decisoes.length>1?'s dependem':' depende'} de decisão ou desbloqueio para seguir. ` : ''}`+
    `No eixo de comunicação, ${fmtNum(medidas.length)} peça${medidas.length!==1?'s':''} mensurada${medidas.length!==1?'s':''} somam ${fmtNum(fAlc)} de alcance, `+
    `com ${pct(tCliqC)} de taxa de clique e ${pct(tConvC)} de conversão sobre os cliques`+
    `${comAlerta.length>0? `; ${comAlerta.length} comunicaç${comAlerta.length>1?'ões seguem':'ão segue'} com alerta editorial ativo` : ''}.`;
}

function exportReportPdf(){
  const voltarPara = state.view;
  if(state.view!=='report'){ navigate('report'); }
  setTimeout(()=>{
    if(voltarPara!=='report'){
      /* Só volta para a tela anterior depois que a caixa de impressão for
         de fato encerrada (salva ou cancelada) — o evento "afterprint" é o
         jeito confiável de saber isso, ao contrário de assumir que
         window.print() bloqueia a execução até lá (não bloqueia em todos os
         navegadores). Trocar o conteúdo da tela antes disso corrompia o PDF
         gerado, já que a captura de impressão acontecia em cima de um DOM
         que mudou no meio do caminho. */
      const aoFecharImpressao = ()=>{ navigate(voltarPara); window.removeEventListener('afterprint', aoFecharImpressao); };
      window.addEventListener('afterprint', aoFecharImpressao);
    }
    window.print();
  }, 150);
}

const TABLE_COLUMNS = [
  {key:'id', label:'ID'}, {key:'dataSolicitacao', label:'Data solicitação'}, {key:'titulo', label:'Título'},
  {key:'editoria', label:'Editoria'}, {key:'responsavel', label:'Responsável'}, {key:'prioridade', label:'Prioridade'},
  {key:'status', label:'Status'}, {key:'dataPlanejadaPublicacao', label:'Data planejada'}, {key:'aging', label:'Aging'},
  {key:'sla', label:'SLA'}, {key:'statusEditorial', label:'Status editorial'}, {key:'alcance', label:'Alcance'}, {key:'alertaEditorial', label:'Alerta'}
];
function renderTableHead(){
  const thead = $('#demTable thead');
  thead.innerHTML = `<tr>${TABLE_COLUMNS.map(col=>{
    const active = state.table.sortKey===col.key;
    const arrow = active? (state.table.sortDir==='asc'?'▲':'▼') : '';
    return `<th data-sort="${col.key}">${col.label} <span class="arrow">${arrow}</span></th>`;
  }).join('')}<th></th></tr>`;
  $$('th[data-sort]', thead).forEach(th=> th.onclick = ()=>{
    const k = th.dataset.sort;
    if(state.table.sortKey===k) state.table.sortDir = state.table.sortDir==='asc'?'desc':'asc';
    else { state.table.sortKey=k; state.table.sortDir='asc'; }
    renderTableBody();
  });
}
function bindDualScroll(){
  const top = $('#tableScrollTop'), main = $('#tableScrollMain'), inner = $('#tableScrollTopInner'), table = $('#demTable');
  if(!top || !main || !table) return;
  inner.style.width = table.scrollWidth + 'px';
  let syncing = false;
  top.onscroll = ()=>{ if(syncing) return; syncing=true; main.scrollLeft = top.scrollLeft; syncing=false; };
  main.onscroll = ()=>{ if(syncing) return; syncing=true; top.scrollLeft = main.scrollLeft; syncing=false; };
}
function renderTableBody(){
  let list = applyFilters(state.demandas);
  list = applySpecialFilter(list);
  const s = state.table.search.trim().toLowerCase();
  if(s) list = list.filter(d=> [d.id,d.titulo,d.solicitante,d.responsavel,d.editoria,d.observacoes].join(' ').toLowerCase().includes(s));
  const key = state.table.sortKey, dir = state.table.sortDir==='asc'?1:-1;
  list = list.slice().sort((a,b)=>{
    let va=a[key], vb=b[key];
    if(va===undefined||va===null) va=''; if(vb===undefined||vb===null) vb='';
    if(typeof va==='number' && typeof vb==='number') return (va-vb)*dir;
    return String(va).localeCompare(String(vb),'pt-BR')*dir;
  });
  const total = list.length;
  const pageSize = state.table.pageSize;
  const totalPages = Math.max(1, Math.ceil(total/pageSize));
  if(state.table.page>totalPages) state.table.page = totalPages;
  const startIdx = (state.table.page-1)*pageSize;
  const pageItems = list.slice(startIdx, startIdx+pageSize);

  const tbody = $('#demTable tbody');
  if(!pageItems.length){
    tbody.innerHTML = `<tr><td colspan="${TABLE_COLUMNS.length+1}">${emptyState('Nenhuma demanda encontrada para os filtros selecionados.')}</td></tr>`;
  } else {
    tbody.innerHTML = pageItems.map(d=>`
      <tr data-id="${d.id}">
        <td><span class="id-tag">${d.id}</span></td>
        <td>${fmtD(d.dataSolicitacao)}</td>
        <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(d.titulo)}">${esc(d.titulo)}</td>
        <td>${esc(d.editoria)}</td>
        <td>${esc(d.responsavel)}</td>
        <td>${badgePrio(d.prioridade)}</td>
        <td>${badgeStatus(d.status)}</td>
        <td>${fmtD(d.dataPlanejadaPublicacao)}${d.atrasada?' <span style="color:var(--red);font-weight:800">●</span>':''}</td>
        <td>${esc(d.aging)}</td>
        <td>${badgeSla(d.sla)}</td>
        <td>${badgeStatusEd(d.statusEditorial)}</td>
        <td>${d.alcance? fmtNum(d.alcance): '—'}</td>
        <td>${d.alertaEditorial? `<span class="alert-tag" title="${esc(d.alertaEditorial)}">⚠ Atenção</span>` : '—'}</td>
        <td><div class="row-actions">
          <button class="icon-btn" data-act="view" title="Visualizar">${ICONS.eye}</button>
          ${state.readOnly? '' : `
          <button class="icon-btn" data-act="edit" title="Editar">${ICONS.edit}</button>
          <button class="icon-btn" data-act="dup" title="Duplicar">${ICONS.copy}</button>
          <button class="icon-btn danger" data-act="del" title="Excluir">${ICONS.trash}</button>`}
        </div></td>
      </tr>`).join('');
  }
  $$('tr[data-id]', tbody).forEach(tr=>{
    tr.addEventListener('click', (e)=>{
      const id = tr.dataset.id;
      const act = e.target.closest('[data-act]');
      if(act){
        e.stopPropagation();
        const a = act.dataset.act;
        if(a==='view') openDetailModal(id);
        else if(a==='edit') openDemandaModal(id);
        else if(a==='dup') doDuplicate(id);
        else if(a==='del') confirmDelete(id);
      } else {
        openDetailModal(id);
      }
    });
  });
  renderPager(total, totalPages);
  bindDualScroll();
}
function badgeStatus(s){ return `<span class="badge" style="background:${STATUS_TINT[s]||'var(--gray-100)'};color:${STATUS_COLOR[s]||'var(--gray-500)'}">${esc(s)}</span>`; }

/* ============================================================================
   KANBAN — uma coluna por status; arrastar um card entre colunas grava o
   novo status na hora (reaproveita ds.updateDemanda, que já persiste na base
   e registra no histórico, igual à edição pelo formulário).
   ============================================================================ */
function renderKanban(){
  const c = $('#content');
  const filtered = applyFilters(state.demandas);
  const colunas = (ds.getConfig().status||[]).filter(s=>s.ativo).map(s=>s.nome);

  c.innerHTML = `
    <div class="filterbar" id="filterbar"></div>
    ${renderActiveFilterChips()}
    <div class="kanban-board" id="kanbanBoard"></div>
  `;
  const fb = $('#filterbar'); fb.innerHTML = renderFilterBar(); bindFilterBar(fb, renderKanban);
  bindActiveFilterChips(c);

  const board = $('#kanbanBoard');
  board.innerHTML = colunas.map(statusNome=>{
    const itens = filtered.filter(d=>d.status===statusNome);
    return `
    <div class="kanban-col" data-status="${esc(statusNome)}">
      <div class="kanban-col-head">
        <span class="kanban-col-title">${esc(statusNome)}</span>
        <span class="kanban-col-count">${itens.length}</span>
      </div>
      <div class="kanban-col-body" data-status="${esc(statusNome)}">
        ${itens.length? itens.map(d=>`
          <div class="kanban-card" draggable="${!state.readOnly}" data-id="${d.id}">
            <div class="kc-top">
              <span class="id-tag">${d.id}</span>
              ${badgePrio(d.prioridade)}
            </div>
            <div class="kc-title" title="${esc(d.titulo)}">${esc(d.titulo)}</div>
            <div class="kc-meta">
              <span>${esc(d.responsavel||'—')}</span>
              <span>${fmtD(d.dataPlanejadaPublicacao)}${d.atrasada?' <span style="color:var(--red);font-weight:800">●</span>':''}</span>
            </div>
          </div>`).join('') : `<div class="kanban-empty">Nenhuma demanda aqui</div>`}
      </div>
    </div>`;
  }).join('');

  $$('.kanban-card', board).forEach(card=>{
    card.addEventListener('click', ()=> openDetailModal(card.dataset.id));
    if(state.readOnly) return;
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
  });

  if(!state.readOnly){
    $$('.kanban-col-body', board).forEach(colBody=>{
      colBody.addEventListener('dragover', e=>{ e.preventDefault(); colBody.classList.add('drag-over'); });
      colBody.addEventListener('dragleave', ()=> colBody.classList.remove('drag-over'));
      colBody.addEventListener('drop', async e=>{
        e.preventDefault();
        colBody.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        const novoStatus = colBody.dataset.status;
        const atual = state.demandas.find(d=>d.id===id);
        if(!atual || atual.status===novoStatus) return;
        await ds.updateDemanda(id, {status: novoStatus});
        toast(`Status de ${id} atualizado para "${novoStatus}".`);
        renderKanban();
      });
    });
  }
}

function badgeStatusEd(s){ return `<span class="badge" style="background:${STATUS_ED_TINT[s]||'var(--gray-100)'};color:${STATUS_ED_COLOR[s]||'var(--gray-500)'}">${esc(s)}</span>`; }
function badgePrio(p){ return `<span class="badge" style="background:${PRIORIDADE_TINT[p]||'var(--gray-100)'};color:${PRIORIDADE_COLOR[p]||'var(--gray-500)'}">${esc(p)}</span>`; }
function badgeSla(s){ const map={Dentro:['var(--ok-tint)','var(--ok)'],Fora:['var(--red-tint)','var(--red)'],'N/A':['var(--gray-100)','var(--gray-500)']}; const [bg,fg]=map[s]||map['N/A']; return `<span class="badge" style="background:${bg};color:${fg}">${s}</span>`; }

function renderPager(total, totalPages){
  const el = $('#pager');
  const p = state.table.page;
  let html = `<button ${p<=1?'disabled':''} data-p="${p-1}">‹</button>`;
  const maxBtns=5;
  let start = Math.max(1,p-2), end=Math.min(totalPages,start+maxBtns-1);
  start = Math.max(1, end-maxBtns+1);
  for(let i=start;i<=end;i++) html += `<button class="${i===p?'active':''}" data-p="${i}">${i}</button>`;
  html += `<button ${p>=totalPages?'disabled':''} data-p="${p+1}">›</button>`;
  html += `<span style="font-size:11.5px;color:var(--gray-500);margin-left:8px">${total} registro(s)</span>`;
  el.innerHTML = html;
  $$('button[data-p]', el).forEach(b=> b.onclick = ()=>{ state.table.page = Number(b.dataset.p); renderTableBody(); });
}

function doDuplicate(id){ ds.duplicateDemanda(id).then(()=>{ toast('Registro duplicado com sucesso.'); renderView(); }); }
function confirmDelete(id){

}

  document.body.appendChild(overlay);
  $('#mClose',overlay).onclick = ()=>overlay.remove();
  $('#mCancel',overlay).onclick = ()=>overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
  $('#fComplexidade',overlay).onchange = e=>{
    const c = lists.complexidades.find(x=>x.nome===e.target.value);
    if(c && !editing) $('#fEsforco',overlay).value = c.esforcoPadrao;
  };
  $$('#canaisApoioTags .tag-chip', overlay).forEach(chip=> chip.onclick = ()=>{
    chip.classList.toggle('on');

  });

      cta: $('#fCta',overlay).value.trim(),
      canalPrincipal: $('#fCanalPrincipal',overlay).value,
      canaisApoio: canaisApoioSel.join(', '),
      horarioPlanejado: $('#fHorario',overlay).value || '',
      dataRealPublicacao: $('#fDataReal',overlay).value || null,
      statusEditorial: $('#fStatusEditorial',overlay).value,
      alcance: Number($('#fAlcance',overlay).value)||0,
      visualizacoes: Number($('#fVisualizacoes',overlay).value)||0,
      curtidas: Number($('#fCurtidas',overlay).value)||0,
      comentarios: Number($('#fComentarios',overlay).value)||0,
      cliques: Number($('#fCliques',overlay).value)||0,
      compartilhamentos: Number($('#fCompartilhamentos',overlay).value)||0,
      acoesConversoes: Number($('#fAcoes',overlay).value)||0,
      resultadoLeitura: $('#fResultado',overlay).value.trim()
    };
  }
  async function doSave(andNew){
    const payload = collect(); if(!payload) return;
    if(editing) await ds.updateDemanda(id, payload); else await ds.createDemanda(payload);
    toast(editing? 'Demanda atualizada com sucesso.' : 'Demanda cadastrada com sucesso.');
    renderView();
    if(andNew){ overlay.remove(); openDemandaModal(null); } else overlay.remove();
  }
  $('#mSave',overlay).onclick = ()=>doSave(false);
  if(!editing) $('#mSaveNew',overlay).onclick = ()=>doSave(true);
}

      </div>
    </div>

  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
  $('#ePdf',overlay).onclick = ()=>{ overlay.remove(); exportReportPdf(); };
  $('#eCsv',overlay).onclick = ()=>{ downloadFile('demandas_comunicacoes.csv', ds.exportCSV(), 'text/csv;charset=utf-8'); toast('Exportação CSV gerada.'); };
  $('#eJson',overlay).onclick = ()=>{ downloadFile('backup_demandas_comunicacoes.json', ds.exportJSON(), 'application/json'); toast('Backup JSON gerado.'); };
  const eClearLocal = $('#eClearLocal',overlay);
  if(eClearLocal) eClearLocal.onclick = ()=>{
    overlay.remove();
    openConfirm('Limpar dados locais', 'Isso apaga os dados de demonstração salvos <b>neste navegador</b> (usados apenas para testar o arquivo HTML sem o backend do Apps Script) e recarrega a página com a base de exemplo original e a data/hora atual. A base compartilhada publicada via Apps Script não é afetada. Deseja continuar?', ()=>{
      Object.values(STORAGE_KEYS).forEach(k=> localStorage.removeItem(k));
      location.reload();
    }, 'Limpar');
  };
  const eImport = $('#eImport',overlay);
  if(eImport) eImport.onchange = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    try{ await ds.importJSON(text); toast('Backup restaurado com sucesso.'); overlay.remove(); renderView(); }
    catch(err){ toast('Arquivo inválido para importação.', true); }
  };
}

/* ============================ CONFIGURAÇÕES ============================ */
const CONFIG_TABS = [
  {key:'responsaveis', label:'Responsáveis', hasEmail:true},
  {key:'editorias', label:'Editorias'},
  {key:'subcategorias', label:'Subcategorias'},
  {key:'status', label:'Status'},
  {key:'prioridades', label:'Prioridades', hasSla:true},
  {key:'complexidades', label:'Complexidades', hasEsforco:true},
  {key:'areasSolicitantes', label:'Áreas solicitantes'},
  {key:'publicos', label:'Públicos-alvo'},
  {key:'objetivos', label:'Objetivos'},
  {key:'canais', label:'Canais'},
  {key:'statusEditorial', label:'Status editorial'}
];
/* Mapeia cada lista de configuração ao campo correspondente na base de
   demandas, para que renomear um parâmetro atualize em cascata os registros
   que já o utilizam (evita registros "órfãos" após uma edição). */
const CONFIG_FIELD_MAP = {
  responsaveis:'responsavel', editorias:'editoria', subcategorias:'subcategoria', status:'status',
  prioridades:'prioridade', complexidades:'complexidade', areasSolicitantes:'areaSolicitante',
  publicos:'publicoAlvo', objetivos:'objetivo', canais:'canalPrincipal', statusEditorial:'statusEditorial'
};
let currentConfigTab = 'responsaveis';
function renderConfigView(){
  const c = $('#content');
  c.innerHTML = `
    ${pageBanner({
      slim:true,
      eyebrow:'Parâmetros do sistema',
      title:'Configurações & <em>listas de apoio</em>',
      sub:'Ajuste status, prioridades, SLAs, responsáveis e demais listas usadas pelos formulários e filtros.'
    })}
    <div class="config-tabs" id="configTabs">${CONFIG_TABS.map(t=>`<div class="config-tab ${t.key===currentConfigTab?'active':''}" data-tab="${t.key}">${t.label}</div>`).join('')}</div>
    <div class="panel"><div id="configBody"></div></div>
  `;
  $$('.config-tab', c).forEach(t=> t.onclick = ()=>{ currentConfigTab = t.dataset.tab; renderConfigView(); });
  renderConfigBody();
}
function renderConfigBody(){
  const tab = CONFIG_TABS.find(t=>t.key===currentConfigTab);
  const items = state.config[currentConfigTab];
  const body = $('#configBody');
  body.innerHTML = `
    <div class="config-list">${items.map((it,idx)=>`
      <div class="config-row ${it.ativo?'':'inactive'}">
        <div>
          <div class="name">${esc(it.nome)}</div>
          <div class="sub">${tab.hasEmail && it.email? esc(it.email): ''}${tab.hasSla? 'SLA: '+it.slaDias+' dias úteis':''}${tab.hasEsforco? 'Esforço padrão: '+it.esforcoPadrao+' pts':''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <label class="switch"><input type="checkbox" data-idx="${idx}" ${it.ativo?'checked':''}><span class="slider"></span></label>
          <button class="icon-btn" data-edit="${idx}" title="Editar">${ICONS.edit}</button>
          <button class="icon-btn danger" data-del="${idx}" title="Remover">${ICONS.trash}</button>
        </div>
      </div>`).join('') || '<div class="empty-state">Nenhum item cadastrado.</div>'}
    </div>
    <div class="add-inline">
      <input type="text" id="newItemName" placeholder="Nome do novo item">
      ${tab.hasEmail? '<input type="text" id="newItemEmail" placeholder="E-mail">':''}
      ${tab.hasSla? '<input type="number" id="newItemSla" placeholder="SLA (dias úteis)" style="max-width:170px">':''}
      ${tab.hasEsforco? '<input type="number" id="newItemEsforco" placeholder="Esforço padrão (pts)" style="max-width:190px">':''}
      <button class="btn btn-primary" id="btnAddItem">${ICONS.plus} Adicionar</button>
    </div>
  `;
  $$('input[type=checkbox][data-idx]', body).forEach(chk=> chk.onchange = async ()=>{
    items[chk.dataset.idx].ativo = chk.checked;
    await ds.saveConfig(state.config);
    toast('Configuração atualizada.');
    renderConfigView();
  });
  $$('button[data-edit]', body).forEach(btn=> btn.onclick = ()=> openEditConfigItem(Number(btn.dataset.edit)));
  $$('button[data-del]', body).forEach(btn=> btn.onclick = ()=>{
    openConfirm('Remover item', `Remover "<b>${esc(items[btn.dataset.del].nome)}</b>"? Registros históricos que já usam este valor não serão alterados.`, async ()=>{
      items.splice(btn.dataset.del,1);
      await ds.saveConfig(state.config);
      closeModal(); toast('Item removido.'); renderConfigView();
    });
  });
  $('#btnAddItem').onclick = async ()=>{
    const name = $('#newItemName').value.trim();
    if(!name){ toast('Informe um nome válido.', true); return; }
    if(items.some(i=>i.nome.toLowerCase()===name.toLowerCase())){ toast('Já existe um item com esse nome.', true); return; }
    const obj = {nome:name, ativo:true};
    if(tab.hasEmail) obj.email = $('#newItemEmail').value.trim();
    if(tab.hasSla) obj.slaDias = Number($('#newItemSla').value)||10;
    if(tab.hasEsforco) obj.esforcoPadrao = Number($('#newItemEsforco').value)||1;
    items.push(obj);
    await ds.saveConfig(state.config);
    toast('Item cadastrado com sucesso.');
    renderConfigView();
  };
}

/* Edição de parâmetros já cadastrados. Se o nome for alterado, os registros
   que já referenciam o valor antigo são atualizados automaticamente para o
   novo valor, preservando a integridade da base. */
function openEditConfigItem(idx){
  const tab = CONFIG_TABS.find(t=>t.key===currentConfigTab);
  const items = state.config[currentConfigTab];
  const it = items[idx];
  const overlay = document.createElement('div'); overlay.className = 'overlay';
  overlay.innerHTML = `<div class="modal modal-sm">
    <div class="modal-head"><h2>Editar parâmetro</h2><div class="close" id="ecClose">${ICONS.x}</div></div>
    <div class="confirm-body">
      <div class="form-field" style="margin-bottom:14px"><label>Nome</label><input type="text" id="ecName" value="${esc(it.nome)}"></div>
      ${tab.hasEmail? `<div class="form-field" style="margin-bottom:14px"><label>E-mail</label><input type="text" id="ecEmail" value="${esc(it.email||'')}"></div>`:''}
      ${tab.hasSla? `<div class="form-field" style="margin-bottom:14px"><label>SLA (dias úteis)</label><input type="number" id="ecSla" value="${it.slaDias||0}"></div>`:''}
      ${tab.hasEsforco? `<div class="form-field" style="margin-bottom:14px"><label>Esforço padrão (pts)</label><input type="number" id="ecEsforco" value="${it.esforcoPadrao||0}"></div>`:''}
      <div class="hint">Se o nome for alterado, os registros que já usam "${esc(it.nome)}" serão atualizados automaticamente para o novo nome.</div>
    </div>
    <div class="modal-foot"><button class="btn" id="ecCancel">Cancelar</button><button class="btn btn-primary" id="ecSave">Salvar alterações</button></div>
  </div>`;
  document.body.appendChild(overlay);
  $('#ecClose',overlay).onclick = ()=>overlay.remove();
  $('#ecCancel',overlay).onclick = ()=>overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
  $('#ecSave',overlay).onclick = async ()=>{
    const newName = $('#ecName',overlay).value.trim();
    if(!newName){ toast('Informe um nome válido.', true); return; }
    const dupe = items.some((x,i)=> i!==idx && x.nome.toLowerCase()===newName.toLowerCase());
    if(dupe){ toast('Já existe um item com esse nome.', true); return; }
    const oldName = it.nome;
    it.nome = newName;
    if(tab.hasEmail) it.email = $('#ecEmail',overlay).value.trim();
    if(tab.hasSla) it.slaDias = Number($('#ecSla',overlay).value)||0;
    if(tab.hasEsforco) it.esforcoPadrao = Number($('#ecEsforco',overlay).value)||0;
    await ds.saveConfig(state.config);
    if(oldName !== newName){
      const field = CONFIG_FIELD_MAP[currentConfigTab];
      let count = 0;
      if(field){
        ds.getDemandas().forEach(d=>{ if(d[field]===oldName){ d[field]=newName; count++; } });
        if(count>0) await ds._persistDemandas();
      }
      toast(count>0? `Parâmetro renomeado. ${count} registro(s) atualizado(s) automaticamente.` : 'Parâmetro atualizado com sucesso.');
    } else {
      toast('Parâmetro atualizado com sucesso.');
    }
    overlay.remove();
    renderConfigView();
  };
}

/* --------------------------------- START --------------------------------- */
boot();
</script>
</body>
</html>
