</script>
<style>

:root{
  --red:#AC0000;
  --red-dark:#7A0000;
  --red-tint:#FBE9E9;
  --gray-900:#2B2E31;
  --gray-800:#3B3F43;
  --gray:#50555A;
  --gray-500:#767B80;
  --gray-300:#C7CBCE;
  --gray-200:#E2E4E6;
  --gray-100:#F0F1F2;
  --gray-50:#F7F8F8;
  --white:#FFFFFF;
  --ok:#1E8E5A;
  --ok-tint:#E5F5EE;
  --warn:#B76A00;
  --warn-tint:#FCEFDD;
  --wait:#B8960C;
  --wait-tint:#FCF6DC;
  --info:#3A6EA5;
  --info-tint:#E9F0F8;
  --crit:#AC0000;
  --crit-tint:#FBE9E9;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:14px;
  --shadow-1: 0 1px 2px rgba(43,46,49,.06), 0 1px 1px rgba(43,46,49,.04);
  --shadow-2: 0 4px 16px rgba(43,46,49,.08);
  --font-display:'Manrope',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-display);
  background:var(--gray-50);
  color:var(--gray-900);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
#app{display:flex;min-height:100vh;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:230px;flex-shrink:0;background:linear-gradient(180deg,#2B2E31 0%,#1D1F21 100%);color:var(--white);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.sidebar-brand{padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--red),var(--red-dark));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:-0.5px;box-shadow:0 4px 14px rgba(172,0,0,.35);}
.sidebar-brand .lines{margin-top:13px;}
.sidebar-brand .l1{font-weight:800;font-size:14.5px;letter-spacing:.2px;}
.sidebar-brand .l2{font-size:11px;color:var(--gray-300);letter-spacing:1.4px;margin-top:3px;font-weight:600;}
.nav{padding:16px 10px;display:flex;flex-direction:column;gap:3px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--gray-300);
  cursor:pointer;font-weight:600;font-size:13.5px;transition:background .15s, color .15s, transform .15s;user-select:none;
  position:relative;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;transition:transform .15s;}
.nav-item:hover{background:rgba(255,255,255,.07);color:var(--white);}
.nav-item:hover svg{transform:translateX(1px);}
.nav-item.active{background:rgba(172,0,0,.16);color:var(--white);}
.nav-item.active:before{content:'';position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--red);}
.nav-item.active svg{opacity:1;color:var(--red);}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:var(--gray-300);}
.sidebar-foot b{color:var(--white);}
.new-demand-btn{
  margin:6px 10px 4px;background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 12px;
  font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;justify-content:center;
  transition:background .15s, transform .1s;
}
.new-demand-btn:hover{background:var(--red-dark);}
.new-demand-btn:active{transform:scale(.98);}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 28px;
  background:var(--white);border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.2px;}
.topbar .sub{color:var(--gray-500);font-size:12.5px;margin-top:2px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.updated-chip{font-size:11.5px;color:var(--gray-500);background:var(--gray-100);padding:6px 10px;border-radius:20px;display:flex;align-items:center;gap:6px;}
.updated-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);}
.content{padding:22px 28px 60px;flex:1;}

/* ---------- BUTTONS ---------- */
.btn{border:1px solid var(--gray-200);background:var(--white);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--gray-900);transition:all .12s;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--gray-300);background:var(--gray-50);}
.btn-primary{background:var(--red);border-color:var(--red);color:#fff;}
.btn-primary:hover{background:var(--red-dark);border-color:var(--red-dark);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--gray-100);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{color:var(--red);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- FILTER BAR ---------- */
.filterbar{
  background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-m);
  padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:18px;
}
.filter-field{display:flex;flex-direction:column;gap:4px;min-width:150px;}
.filter-field label{font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.4px;}
select, input[type=text], input[type=date], input[type=number], textarea{
  font-family:var(--font-display);border:1px solid var(--gray-200);border-radius:7px;padding:7px 9px;font-size:13px;
  background:var(--white);color:var(--gray-900);outline:none;transition:border-color .12s;
}
select:focus, input:focus, textarea:focus{border-color:var(--red);}
.multiselect{position:relative;}
.multiselect-btn{border:1px solid var(--gray-200);border-radius:7px;padding:7px 9px;font-size:13px;background:#fff;cursor:pointer;min-width:150px;display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--gray-900);}
.multiselect-btn:hover{border-color:var(--gray-300);}
.multiselect-panel{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--gray-200);border-radius:8px;box-shadow:var(--shadow-2);padding:8px;z-index:50;min-width:220px;max-height:240px;overflow:auto;}
.multiselect-panel label{display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:13px;font-weight:500;border-radius:5px;cursor:pointer;}
.multiselect-panel label:hover{background:var(--gray-50);}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.chip{display:flex;align-items:center;gap:6px;background:var(--red-tint);color:var(--red-dark);border-radius:20px;padding:4px 6px 4px 12px;font-size:12px;font-weight:600;}
.chip button{border:none;background:rgba(172,0,0,.12);color:var(--red-dark);width:17px;height:17px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;}

/* ---------- KPI CARDS ---------- */
/* Flexbox em vez de grid: garante que TODA linha — inclusive a última,
   mesmo com menos itens que as anteriores — estique os cards para ocupar
   100% da largura disponível, sem sobras em branco. */
.kpi-grid{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
.kpi-grid > .kpi-card{flex:1 1 200px;}
.kpi-subhead{font-size:11px;font-weight:800;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px;display:flex;align-items:center;gap:6px;}
.kpi-grid-top{margin-bottom:14px;}
.kpi-grid-top > .kpi-card{flex:1 1 240px;padding:22px 22px 20px;background:linear-gradient(180deg,var(--white) 0%,var(--gray-50) 100%);}
.kpi-grid-top .kpi-value{font-size:38px;letter-spacing:-1px;}
.kpi-grid-top .kpi-label{font-size:13px;}
.kpi-grid-top .kpi-icon{width:38px;height:38px;}
.kpi-grid-top .kpi-icon svg{width:19px;height:19px;}

/* ---------- Grid com card de destaque (Demandas em Aberto) ---------- */
.kpi-grid-hero{
  display:grid;
  grid-template-columns:1.45fr 1fr 1fr 1fr;
  grid-auto-rows:1fr;
  gap:14px;margin-bottom:22px;align-items:stretch;
}
.kpi-grid-hero > .kpi-card{flex:none;min-width:0;}
.kpi-card.kpi-hero{
  grid-column:1;grid-row:1 / span 2;
  display:flex;flex-direction:column;
  padding:24px 24px 22px;
  background:linear-gradient(155deg,var(--white) 0%,var(--gray-50) 100%);
  border-color:var(--gray-300);
  box-shadow:var(--shadow-1);
}
.kpi-card.kpi-hero .kpi-accent{height:5px;}
.kpi-card.kpi-hero .kpi-icon{width:44px;height:44px;border-radius:13px;}
.kpi-card.kpi-hero .kpi-icon svg{width:22px;height:22px;}
.kpi-hero-mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 0 4px;}
.kpi-card.kpi-hero .kpi-value{font-size:62px;line-height:1;letter-spacing:-2.5px;margin-top:0;}
.kpi-card.kpi-hero .kpi-label{font-size:14px;font-weight:800;color:var(--gray-800);margin-top:7px;letter-spacing:-.1px;}
.kpi-hero-share{font-size:12px;color:var(--gray-500);font-weight:600;margin-top:4px;}
.kpi-hero-share b{color:var(--gray-800);font-weight:800;}
.kpi-hero-foot{border-top:1px solid var(--gray-200);padding-top:13px;}
.kpi-hero-foot .cap{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--gray-500);margin-bottom:8px;}
.kpi-hero-bar{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--gray-100);gap:2px;}
.kpi-hero-bar span{display:block;height:100%;border-radius:2px;}
.kpi-hero-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:11px;}
.kpi-hero-legend .it{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--gray);}
.kpi-hero-legend .it i{width:8px;height:8px;border-radius:3px;flex-shrink:0;}
.kpi-hero-legend .it b{font-weight:800;color:var(--gray-900);font-variant-numeric:tabular-nums;}
@media (max-width:1200px){
  .kpi-grid-hero{grid-template-columns:1.35fr 1fr 1fr;}
  .kpi-card.kpi-hero{grid-row:1 / span 3;}
  .kpi-card.kpi-hero .kpi-value{font-size:54px;}
}
@media (max-width:900px){
  .kpi-grid-hero{grid-template-columns:1fr 1fr;grid-auto-rows:auto;}
  .kpi-card.kpi-hero{grid-column:1 / -1;grid-row:auto;}
  .kpi-card.kpi-hero .kpi-value{font-size:46px;}
}
@media (max-width:560px){
  .kpi-grid-hero{grid-template-columns:1fr;}
}
.kpi-card{
  background:var(--white);border:1px solid var(--gray-200);border-radius:16px;padding:17px 17px 16px;
  position:relative;cursor:default;
  transition:box-shadow .2s cubic-bezier(.2,.8,.2,1), transform .2s cubic-bezier(.2,.8,.2,1), border-color .2s;
  animation:kpiIn .4s cubic-bezier(.2,.8,.2,1) backwards;
}
.kpi-card.popover-open{z-index:80;}
@keyframes kpiIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px;opacity:.9;border-radius:16px 16px 0 0;}
.kpi-card.clickable{cursor:pointer;}
.kpi-card.clickable:hover{box-shadow:0 10px 28px rgba(43,46,49,.12), 0 2px 8px rgba(43,46,49,.06);transform:translateY(-3px);border-color:var(--gray-300);}
.kpi-card.clickable:active{transform:translateY(-1px) scale(.99);}
.kpi-top{display:flex;justify-content:space-between;align-items:flex-start;}
.kpi-icon{width:32px;height:32px;border-radius:10px;background:var(--gray-100);display:flex;align-items:center;justify-content:center;color:var(--gray);flex-shrink:0;transition:transform .2s;}
.kpi-card.clickable:hover .kpi-icon{transform:scale(1.08);}
.kpi-icon svg{width:16px;height:16px;}
.kpi-value{font-size:27px;font-weight:800;margin-top:12px;letter-spacing:-.6px;font-variant-numeric:tabular-nums;color:var(--gray-900);}
.kpi-label{font-size:12px;color:var(--gray-500);font-weight:600;margin-top:3px;}
.kpi-trend{font-size:11px;margin-top:8px;font-weight:700;display:flex;align-items:center;gap:4px;}
.trend-up{color:var(--red);}
.trend-down{color:var(--ok);}
.trend-flat{color:var(--gray-500);}
.kpi-card[data-tone=crit] .kpi-value{color:var(--crit);}
.kpi-card[data-tone=warn] .kpi-value{color:var(--warn);}
.kpi-card[data-tone=ok] .kpi-value{color:var(--ok);}

/* Info tooltip ("i") presente em todos os cards */
.info-ico{position:relative;width:19px;height:19px;border-radius:50%;background:var(--gray-100);color:var(--gray-500);
  display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;font-style:italic;
  font-family:Georgia,serif;cursor:pointer;flex-shrink:0;transition:background .15s,color .15s;}
.info-ico:hover, .info-ico:focus-visible{background:var(--red);color:#fff;outline:none;}
.info-pop{position:absolute;top:calc(100% + 8px);right:-6px;background:var(--gray-900);color:#fff;padding:10px 12px;
  border-radius:9px;font-size:11.5px;font-weight:500;line-height:1.45;width:216px;
  box-shadow:0 14px 30px rgba(0,0,0,.24);z-index:90;text-align:left;}
.info-pop:before{content:'';position:absolute;bottom:100%;right:14px;border:6px solid transparent;border-bottom-color:var(--gray-900);}
.info-pop.hidden{display:none;}
.info-pop.align-left{right:auto;left:-6px;}
.info-pop.align-left:before{right:auto;left:14px;}

/* ---------- PANELS / GRID ---------- */
.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
.panel{background:var(--white);border:1px solid var(--gray-200);border-radius:16px;padding:19px;position:relative;transition:box-shadow .2s, border-color .2s;}
.panel.popover-open{z-index:80;}
.panel:hover{box-shadow:0 6px 20px rgba(43,46,49,.06);}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px;gap:10px;}
.panel-title{font-size:13px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:4px;}
.panel-sub{font-size:11.5px;color:var(--gray-500);margin-top:3px;font-weight:500;}
.chart-wrap{position:relative;}
.empty-state{padding:36px 10px;text-align:center;color:var(--gray-500);font-size:13px;}
.empty-state .ico{font-size:22px;margin-bottom:8px;opacity:.5;}

/* Visão Geral: painel de resumo executivo (texto solto, tipografia confortável) */
.vg-summary-panel{margin-bottom:18px;border-color:var(--gray-300);}

/* Kanban */
.kanban-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start;}
.kanban-col{flex:0 0 270px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:14px;padding:10px;display:flex;flex-direction:column;max-height:calc(100vh - 300px);}
.kanban-col-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;font-size:12.5px;font-weight:800;letter-spacing:.2px;color:var(--gray-800);}
.kanban-col-count{background:var(--white);border:1px solid var(--gray-200);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--gray-500);font-weight:700;}
.kanban-col-body{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;padding:2px;border-radius:10px;transition:background .15s;}
.kanban-col-body.drag-over{background:var(--red-tint);outline:2px dashed var(--red);}
.kanban-card{background:var(--white);border:1px solid var(--gray-200);border-radius:10px;padding:10px;cursor:pointer;transition:box-shadow .15s, transform .1s;}
.kanban-card:hover{box-shadow:0 4px 14px rgba(43,46,49,.08);}
.kanban-card.dragging{opacity:.4;}
.kc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.kc-title{font-size:13px;font-weight:700;color:var(--gray-800);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kc-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--gray-500);font-weight:600;}
.kanban-empty{font-size:12px;color:var(--gray-400);text-align:center;padding:18px 6px;}
.vg-summary-text{margin:0;font-size:14.5px;line-height:1.75;color:var(--gray-800);font-weight:500;max-width:920px;}

/* Attention panel */
.attn-list{display:flex;flex-direction:column;gap:8px;}
.attn-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:9px;background:var(--gray-50);cursor:pointer;transition:background .12s;border:1px solid transparent;}
.attn-row:hover{background:var(--gray-100);border-color:var(--gray-200);}
.attn-row .l{display:flex;align-items:center;gap:10px;}
.attn-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.attn-name{font-weight:700;font-size:13px;}
.attn-desc{font-size:11.5px;color:var(--gray-500);}
.attn-count{font-weight:800;font-size:15px;background:var(--white);border:1px solid var(--gray-200);border-radius:7px;padding:3px 10px;min-width:32px;text-align:center;}

/* Insights */
.insight-list{display:flex;flex-direction:column;gap:10px;}
.insight-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--gray-50);font-size:12.8px;line-height:1.45;}
.insight-item .bullet{width:6px;height:6px;border-radius:50%;background:var(--red);margin-top:6px;flex-shrink:0;}

/* Responsavel bars */
.resp-row{margin-bottom:14px;cursor:pointer;padding:8px;border-radius:8px;transition:background .12s;}
.resp-row:hover{background:var(--gray-50);}
.resp-row-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:5px;}
.resp-row-head .meta{font-weight:500;color:var(--gray-500);font-size:11.5px;}
.resp-bar-track{height:14px;border-radius:7px;background:var(--gray-100);overflow:hidden;display:flex;}
.resp-bar-seg{height:100%;}
.resp-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--gray-500);}
.resp-legend span{display:inline-flex;align-items:center;gap:5px;}
.legend-dot{width:8px;height:8px;border-radius:2px;display:inline-block;}

/* Heatmap */
.heatmap{width:100%;border-collapse:separate;border-spacing:4px;}
.heatmap th{font-size:10.5px;color:var(--gray-500);font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:4px;}
.heatmap td{text-align:center;border-radius:8px;padding:12px 4px;font-weight:800;font-size:14px;cursor:pointer;transition:transform .1s;color:var(--gray-900);}
.heatmap td:hover{transform:scale(1.06);}
.heatmap td.z0{background:var(--gray-50);color:var(--gray-300);cursor:default;}
.heatmap .rowlabel{text-align:left;font-size:11.5px;font-weight:700;color:var(--gray-800);padding-left:6px;}

/* ---------- TABLE ---------- */
.table-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;flex-wrap:wrap;}
.search-box{position:relative;flex:1;max-width:320px;}
.search-box input{width:100%;padding-left:32px;}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--gray-500);}
.table-wrap{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-m);overflow:hidden;}
.table-scroll-top{overflow-x:auto;overflow-y:hidden;height:14px;border-bottom:1px solid var(--gray-200);}
.table-scroll-top::-webkit-scrollbar{height:10px;}
.table-scroll-top-inner{height:1px;}
.table-scroll-main{overflow-x:auto;}
table.datatable{width:100%;border-collapse:collapse;font-size:12.8px;}
table.datatable thead th{
  text-align:left;padding:11px 12px;background:var(--gray-50);color:var(--gray-500);font-weight:700;
  font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--gray-200);cursor:pointer;white-space:nowrap;user-select:none;
}
table.datatable thead th:hover{color:var(--gray-900);}
table.datatable thead th .arrow{margin-left:3px;opacity:.5;}
table.datatable tbody td{padding:10px 12px;border-bottom:1px solid var(--gray-100);vertical-align:middle;}
table.datatable tbody tr{transition:background .1s;cursor:pointer;}
table.datatable tbody tr:hover{background:var(--gray-50);}
table.datatable tbody tr:last-child td{border-bottom:none;}
.id-tag{font-family:var(--font-mono);font-weight:600;font-size:11.5px;color:var(--gray);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.row-actions{display:flex;gap:4px;justify-content:flex-end;}
.icon-btn{width:26px;height:26px;border-radius:6px;border:1px solid transparent;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray-500);transition:all .12s;}
.icon-btn:hover{background:var(--gray-100);color:var(--gray-900);}
.icon-btn svg{width:14px;height:14px;}
.icon-btn.danger:hover{background:var(--red-tint);color:var(--red);}
.table-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid var(--gray-200);}
.pager{display:flex;gap:4px;align-items:center;}
.pager button{border:1px solid var(--gray-200);background:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:600;}
.pager button.active{background:var(--red);border-color:var(--red);color:#fff;}
.pager button:disabled{opacity:.4;cursor:not-allowed;}
.pagesize select{padding:5px 8px;font-size:12px;}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,32,34,.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:32px 16px;overflow:auto;animation:fadein .12s ease;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:var(--radius-l);width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:slideup .15s ease;}
@keyframes slideup{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal.modal-sm{max-width:420px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--gray-200);}
.modal-head h2{margin:0;font-size:16.5px;font-weight:800;}
.modal-head .close{cursor:pointer;color:var(--gray-500);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.modal-head .close:hover{background:var(--gray-100);}
.modal-body{padding:20px 22px;max-height:70vh;overflow:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--gray-200);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.span2{grid-column:1/-1;}
.form-field label{font-size:12px;font-weight:700;color:var(--gray-800);}
.form-field label .req{color:var(--red);}
.form-field .hint{font-size:11px;color:var(--gray-500);}
textarea{resize:vertical;min-height:56px;font-family:var(--font-display);}
.readonly-field{background:var(--gray-100);color:var(--gray-500);}
.toast-container{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--gray-900);color:#fff;padding:12px 16px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow-2);display:flex;align-items:center;gap:10px;animation:slidein .15s ease;min-width:220px;}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.err{background:var(--red-dark);}
.toast .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0;}
.toast.err .dot{background:#fff;}

/* Detail modal */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:16px;}
.detail-item .k{font-size:11px;color:var(--gray-500);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
.detail-item .v{font-size:13.5px;font-weight:600;}
.detail-section-title{font-size:11.5px;font-weight:800;color:var(--gray-500);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px;border-top:1px solid var(--gray-200);padding-top:14px;}
.history-item{display:flex;gap:10px;padding:8px 0;font-size:12.5px;border-bottom:1px dashed var(--gray-200);}
.history-item:last-child{border-bottom:none;}
.history-item .t{color:var(--gray-500);font-family:var(--font-mono);font-size:11px;white-space:nowrap;}

/* ---------- CONFIG VIEW ---------- */
.config-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--gray-200);}
.config-tab{padding:9px 14px;font-size:13px;font-weight:700;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.config-tab.active{color:var(--red);border-bottom-color:var(--red);}
.config-list{display:flex;flex-direction:column;gap:6px;}
.config-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--gray-50);border-radius:8px;border:1px solid var(--gray-200);}
.config-row .name{font-weight:700;font-size:13px;}
.config-row .sub{font-size:11.5px;color:var(--gray-500);margin-top:1px;}
.config-row.inactive{opacity:.5;}
.switch{position:relative;width:36px;height:20px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;inset:0;background:var(--gray-300);border-radius:20px;cursor:pointer;transition:.15s;}
.switch .slider:before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked + .slider{background:var(--ok);}
.switch input:checked + .slider:before{transform:translateX(16px);}
.add-inline{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.add-inline input{flex:1;min-width:140px;}

/* View sections */
.view-title{margin-bottom:16px;}
.view-title h2{margin:0;font-size:18px;font-weight:800;}
.view-title p{margin:3px 0 0;font-size:12.5px;color:var(--gray-500);}

/* Confirm dialog */
.confirm-body{padding:20px 22px;font-size:13.5px;color:var(--gray-800);}
#btnRefresh.spinning svg{animation:spin .8s linear infinite;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

@media (max-width:1200px){
  .grid-2, .grid-3{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:1fr;}
}
@media (max-width:820px){
  .sidebar{position:fixed;left:-224px;z-index:90;transition:left .2s;}
  .sidebar.open{left:0;}
  .content{padding:16px;}
  .topbar{padding:12px 16px;}
}
.hidden{display:none !important;}

/* ---------- Extras herdados do módulo Comunicações (mesma linguagem visual) ---------- */
.grid-2-even{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.top-tabs{display:flex;gap:6px;margin-bottom:12px;}
.top-tab{padding:6px 12px;font-size:12px;font-weight:700;border-radius:20px;background:var(--gray-100);color:var(--gray-500);cursor:pointer;}
.top-tab.active{background:var(--red);color:#fff;}
.top-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;background:var(--gray-50);margin-bottom:6px;font-size:12.5px;cursor:pointer;}
.top-item:hover{background:var(--gray-100);}
.top-item .rank{width:20px;height:20px;border-radius:50%;background:var(--gray-900);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:8px;}
.top-item .name{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-item .val{font-weight:800;color:var(--red-dark);white-space:nowrap;margin-left:8px;}
.alert-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--warn);}
.form-section-title{font-size:11.5px;font-weight:800;color:var(--red-dark);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px;}
.form-section-title:first-child{margin-top:0;}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px;}
.metric-box{background:var(--gray-50);border-radius:9px;padding:10px;text-align:center;}
.metric-box .n{font-size:17px;font-weight:800;}
.metric-box .l{font-size:10.5px;color:var(--gray-500);font-weight:700;text-transform:uppercase;margin-top:2px;}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.tag-chip{display:inline-flex;align-items:center;gap:5px;background:var(--gray-100);border-radius:14px;padding:3px 10px 3px 10px;font-size:11.5px;font-weight:600;cursor:pointer;}
.tag-chip.on{background:var(--red);color:#fff;}

/* ---------- Seletor de workspace (unificação dos módulos) ---------- */
.workspace-switch{display:flex;gap:4px;margin:14px 10px 4px;background:rgba(255,255,255,.06);border-radius:10px;padding:4px;}
.ws-btn{flex:1;border:none;background:transparent;color:var(--gray-300);font-size:11.5px;font-weight:700;padding:8px 6px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s;text-align:center;line-height:1.25;}
.ws-btn.active{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(172,0,0,.35);}
.ws-btn:not(.active):hover{background:rgba(255,255,255,.08);color:#fff;}

@media (max-width:1200px){
  .grid-2-even{grid-template-columns:1fr;}
  .metric-grid{grid-template-columns:repeat(2,1fr);}
}

.section-divider{display:flex;align-items:center;gap:12px;margin:28px 0 16px;}
.section-divider .lbl{font-size:12px;font-weight:800;color:var(--red-dark);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;}
.section-divider .line{flex:1;height:1px;background:var(--gray-200);}
.section-divider:first-child{margin-top:0;}

/* ---------------------------- ONE PAGE REPORT ---------------------------- */
.report-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.report-meta{font-size:12px;color:var(--gray-500);}
.report-page{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-l);box-shadow:var(--shadow-1);max-width:960px;margin:0 auto;padding:40px 44px;}
.report-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--red);padding-bottom:18px;margin-bottom:24px;}
.report-header .brandline{display:flex;align-items:center;gap:12px;}
.report-header .brandmark{width:42px;height:42px;border-radius:10px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;}
.report-header h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.3px;}
.report-header .sub{font-size:12.5px;color:var(--gray-500);margin-top:2px;font-weight:600;}
.report-header .meta-right{text-align:right;font-size:11.5px;color:var(--gray-500);}
.report-header .meta-right b{color:var(--gray-900);}
.report-summary{background:var(--gray-50);border-left:4px solid var(--red);border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.55;margin-bottom:24px;color:var(--gray-800);}
.report-kpi-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:26px;}
.report-kpi{background:var(--gray-50);border-radius:9px;padding:12px 10px;text-align:center;}
.report-kpi .n{font-size:20px;font-weight:800;color:var(--gray-900);letter-spacing:-.3px;}
.report-kpi .l{font-size:10px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.3px;margin-top:3px;line-height:1.3;}
.report-kpi[data-tone=crit] .n{color:var(--red);}
.report-kpi[data-tone=warn] .n{color:var(--warn);}
.report-kpi[data-tone=ok] .n{color:var(--ok);}
.report-section-title{font-size:11.5px;font-weight:800;color:var(--red-dark);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.report-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;}
.report-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11.5px;}
.report-bar-row .rlabel{width:130px;flex-shrink:0;color:var(--gray-800);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.report-bar-track{flex:1;height:10px;background:var(--gray-100);border-radius:5px;overflow:hidden;}
.report-bar-fill{height:100%;background:var(--gray-800);border-radius:5px;}
.report-bar-row .rval{width:24px;text-align:right;font-weight:700;color:var(--gray-900);flex-shrink:0;}
.report-risk-item{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--gray-200);font-size:12px;}
.report-risk-item:last-child{border-bottom:none;}
.report-risk-item .rtitle{font-weight:700;color:var(--gray-900);}
.report-risk-item .rmeta{color:var(--gray-500);font-size:11px;}
.report-risk-item .rdays{font-weight:800;color:var(--red);white-space:nowrap;}
.report-insights{margin-bottom:24px;}
.report-insight-item{display:flex;gap:8px;font-size:12.5px;line-height:1.5;margin-bottom:8px;color:var(--gray-800);}
.report-insight-item .b{color:var(--red);font-weight:800;flex-shrink:0;}
.report-footer{border-top:1px solid var(--gray-200);padding-top:14px;margin-top:8px;display:flex;justify-content:space-between;font-size:10.5px;color:var(--gray-500);}
@media (max-width:1000px){
  .report-kpi-strip{grid-template-columns:repeat(3,1fr);}
  .report-grid-2{grid-template-columns:1fr;}
}
@media print{
  body *{visibility:hidden;}
  #reportPage, #reportPage *{visibility:visible;}
  #reportPage{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:none;max-width:100%;padding:10px 20px;}
  .report-toolbar{display:none !important;}
  @page{margin:14mm;}
}

/* ==========================================================================
   CAMADA PREMIUM 3D — profundidade, materiais e banners
   Paleta oficial: vermelho #AC0000 · cinza #50555A
   ========================================================================== */
:root{
  --elev-1: 0 1px 2px rgba(43,46,49,.05), 0 2px 6px -2px rgba(43,46,49,.08);
  --elev-2: 0 2px 4px rgba(43,46,49,.05), 0 10px 24px -10px rgba(43,46,49,.16);
  --elev-3: 0 4px 8px rgba(43,46,49,.06), 0 20px 44px -16px rgba(43,46,49,.22);
  --elev-red: 0 10px 30px -12px rgba(172,0,0,.42);
  --sheen: inset 0 1px 0 rgba(255,255,255,.92);
  --edge: inset 0 -1px 0 rgba(43,46,49,.055);
  --grad-red: linear-gradient(135deg,#C41111 0%,#AC0000 48%,#7A0000 100%);
  --grad-graphite: linear-gradient(150deg,#3B3F43 0%,#2B2E31 55%,#1B1D1F 100%);
  --ease-3d: cubic-bezier(.16,.84,.28,1);
}

/* ---------- Fundo com profundidade ambiente ---------- */
body{
  background:
    radial-gradient(1100px 520px at 82% -12%, rgba(172,0,0,.055) 0%, rgba(172,0,0,0) 62%),
    radial-gradient(900px 480px at 6% 4%, rgba(80,85,90,.075) 0%, rgba(80,85,90,0) 60%),
    linear-gradient(180deg,#F7F8F8 0%,#F1F2F3 100%);
  background-attachment:fixed;
}

/* ---------- Sidebar com material 3D ---------- */
.sidebar{
  background:var(--grad-graphite);
  box-shadow:6px 0 28px -14px rgba(0,0,0,.55), inset -1px 0 0 rgba(255,255,255,.06);
  position:sticky;z-index:30;
}
.sidebar:before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(420px 200px at 12% 0%, rgba(255,255,255,.09), transparent 70%),
    radial-gradient(360px 260px at 100% 100%, rgba(172,0,0,.20), transparent 72%);
}
.sidebar > *{position:relative;z-index:1;}
.sidebar-brand .mark{
  background:var(--grad-red);
  box-shadow:0 8px 20px -6px rgba(172,0,0,.75), inset 0 1px 0 rgba(255,255,255,.34), inset 0 -2px 6px rgba(0,0,0,.28);
  transform:translateZ(0);transition:transform .35s var(--ease-3d), box-shadow .35s var(--ease-3d);
}
.sidebar-brand:hover .mark{transform:translateY(-2px) rotate(-3deg) scale(1.05);box-shadow:0 14px 28px -8px rgba(172,0,0,.85), inset 0 1px 0 rgba(255,255,255,.4);}
.nav-item{transition:background .2s var(--ease-3d), color .2s, transform .2s var(--ease-3d), box-shadow .2s;}
.nav-item:hover{transform:translateX(3px);}
.nav-item.active{
  background:linear-gradient(90deg, rgba(172,0,0,.34) 0%, rgba(172,0,0,.10) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 6px 16px -10px rgba(172,0,0,.9);
}
.nav-item.active:before{
  background:var(--grad-red);width:4px;
  box-shadow:0 0 14px rgba(172,0,0,.95);
}
.new-demand-btn{
  background:var(--grad-red);
  box-shadow:0 8px 18px -8px rgba(172,0,0,.9), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.22);
  transition:transform .18s var(--ease-3d), box-shadow .18s var(--ease-3d), filter .18s;
}
.new-demand-btn:hover{background:var(--grad-red);filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 14px 26px -10px rgba(172,0,0,.95), inset 0 1px 0 rgba(255,255,255,.32);}
.new-demand-btn:active{transform:translateY(1px) scale(.985);box-shadow:0 4px 10px -6px rgba(172,0,0,.9), inset 0 2px 5px rgba(0,0,0,.3);}
/* O SVG do botão não tinha dimensão definida e esticava, inflando a altura da sidebar. */
.new-demand-btn svg{width:16px;height:16px;flex-shrink:0;}
.sidebar-foot{background:rgba(0,0,0,.18);}

/* ---------- Topbar em vidro ---------- */
.topbar{
  background:rgba(255,255,255,.78);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);
  backdrop-filter:blur(16px) saturate(1.5);
  border-bottom:1px solid rgba(43,46,49,.09);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 10px 26px -22px rgba(43,46,49,.55);
}
.topbar h1{
  background:linear-gradient(120deg,#2B2E31 0%,#50555A 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.updated-chip{
  background:linear-gradient(180deg,#fff,var(--gray-100));
  border:1px solid var(--gray-200);
  box-shadow:var(--sheen), 0 1px 2px rgba(43,46,49,.05);
}
.updated-chip .dot{box-shadow:0 0 0 3px rgba(30,142,90,.16);animation:pulseDot 2.4s ease-in-out infinite;}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 3px rgba(30,142,90,.16);}50%{box-shadow:0 0 0 6px rgba(30,142,90,.04);}}

/* ---------- Botões com relevo ---------- */
.btn{
  background:linear-gradient(180deg,#fff 0%,#F6F7F7 100%);
  box-shadow:var(--sheen), 0 1px 2px rgba(43,46,49,.06);
  transition:transform .15s var(--ease-3d), box-shadow .15s var(--ease-3d), border-color .15s, background .15s;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sheen), 0 6px 14px -6px rgba(43,46,49,.28);}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(43,46,49,.14);}
.btn-primary{background:var(--grad-red);box-shadow:var(--elev-red), inset 0 1px 0 rgba(255,255,255,.28);}
.btn-primary:hover{filter:brightness(1.08);box-shadow:0 14px 28px -10px rgba(172,0,0,.6), inset 0 1px 0 rgba(255,255,255,.3);}
.btn-ghost{background:transparent;box-shadow:none;}

/* ================= BANNER ================= */
.hero-banner{
  position:relative;overflow:hidden;
  border-radius:22px;margin-bottom:20px;
  padding:30px 34px;
  background:var(--grad-graphite);
  color:#fff;
  box-shadow:var(--elev-3), inset 0 1px 0 rgba(255,255,255,.10);
  display:flex;align-items:center;justify-content:space-between;gap:28px;
  isolation:isolate;
}
.hero-banner:before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(680px 340px at 88% 120%, rgba(172,0,0,.55) 0%, rgba(172,0,0,0) 68%),
    radial-gradient(520px 260px at 4% -30%, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 70%);
}
.hero-banner:after{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.4;
  background-image:
    linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
  background-size:46px 46px;
  transform:perspective(560px) rotateX(58deg) scale(1.9);
  transform-origin:bottom center;
  -webkit-mask-image:linear-gradient(180deg, transparent 34%, #000 100%);
  mask-image:linear-gradient(180deg, transparent 34%, #000 100%);
}
.hb-content{position:relative;z-index:2;max-width:600px;min-width:0;}
.hb-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:#F3D3D3;background:rgba(172,0,0,.32);border:1px solid rgba(255,120,120,.30);
  padding:5px 12px;border-radius:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 6px 16px -10px rgba(172,0,0,.9);
}
.hb-eyebrow .pulse{width:6px;height:6px;border-radius:50%;background:#FF6B6B;box-shadow:0 0 10px #FF6B6B;animation:pulseDot2 2s ease-in-out infinite;}
@keyframes pulseDot2{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(.8);}}
.hb-title{
  font-size:31px;font-weight:800;letter-spacing:-1px;line-height:1.12;margin:15px 0 0;
  text-shadow:0 2px 20px rgba(0,0,0,.35);
}
.hb-title em{
  font-style:normal;
  background:linear-gradient(100deg,#FF8080 0%,#E33 45%,#FF9E9E 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hb-sub{font-size:13.5px;color:rgba(255,255,255,.72);margin:9px 0 0;line-height:1.55;font-weight:500;}
.hb-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:19px;}
.hb-stat{
  position:relative;min-width:118px;padding:11px 15px 10px;border-radius:14px;
  background:linear-gradient(160deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.045) 100%);
  border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 10px 24px -14px rgba(0,0,0,.9);
  transition:transform .3s var(--ease-3d), box-shadow .3s var(--ease-3d), border-color .3s;
  cursor:default;
}
.hb-stat:hover{transform:translateY(-4px) scale(1.03);border-color:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.26), 0 20px 34px -18px rgba(0,0,0,1);}
.hb-stat .v{font-size:23px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1.1;}
.hb-stat .k{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.62);text-transform:uppercase;letter-spacing:.7px;margin-top:3px;}
.hb-stat.crit .v{color:#FF8A8A;}
.hb-stat.ok .v{color:#6EE7B0;}
.hb-stat.warn .v{color:#FFC978;}
.hb-float{animation:floaty 7s ease-in-out infinite;transform-origin:center;}
.hb-float-2{animation:floaty 7s ease-in-out infinite reverse;animation-delay:-1.6s;transform-origin:center;}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
.hero-banner.slim{padding:20px 26px;border-radius:18px;margin-bottom:18px;}
.hero-banner.slim .hb-title{font-size:20px;margin-top:11px;}
.hero-banner.slim .hb-sub{font-size:12.5px;}
@media (max-width:1000px){
  .hero-banner{padding:24px;}
  .hb-title{font-size:24px;}
}

/* ---------- KPI CARDS: material extrudado ---------- */
.kpi-card{
  background:linear-gradient(168deg,#FFFFFF 0%,#FCFCFD 55%,#F5F6F7 100%);
  border-color:rgba(43,46,49,.10);
  box-shadow:var(--sheen), var(--edge), var(--elev-1);
  transform-style:preserve-3d;
  transition:transform .38s var(--ease-3d), box-shadow .38s var(--ease-3d), border-color .3s;
}
.kpi-card:before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 34%);
  opacity:.9;
}
.kpi-accent{
  height:4px;opacity:1;
  box-shadow:0 3px 12px -2px currentColor;
  filter:saturate(1.15);
}
/* Mesmo comportamento das pastilhas do banner: elevação vertical, sem inclinação lateral. */
.kpi-card.clickable:hover{
  transform:translateY(-4px) scale(1.03);
  box-shadow:var(--sheen), var(--elev-3);
  border-color:rgba(172,0,0,.22);
}
.kpi-card.clickable:active{transform:translateY(-1px) scale(1.005);}
.kpi-icon{
  border-radius:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 -2px 4px rgba(43,46,49,.07), 0 6px 14px -8px rgba(43,46,49,.55);
  transition:transform .32s var(--ease-3d), box-shadow .32s var(--ease-3d);
}
.kpi-card.clickable:hover .kpi-icon{transform:translateY(-2px) scale(1.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 12px 22px -8px rgba(43,46,49,.6);}
.kpi-value{text-shadow:0 1px 0 rgba(255,255,255,.9);}
.kpi-grid-top > .kpi-card{
  background:linear-gradient(168deg,#FFFFFF 0%,#F8F9FA 100%);
  box-shadow:var(--sheen), var(--edge), var(--elev-2);
}

/* ---------- Card de destaque: vitrine 3D ---------- */
.kpi-card.kpi-hero{
  background:
    radial-gradient(520px 300px at 118% -20%, rgba(172,0,0,.10) 0%, rgba(172,0,0,0) 62%),
    linear-gradient(158deg,#FFFFFF 0%,#FAFBFB 46%,#F1F2F3 100%);
  border-color:rgba(172,0,0,.16);
  box-shadow:var(--sheen), var(--edge), var(--elev-3);
  overflow:hidden;
}
.kpi-card.kpi-hero:after{
  content:'';position:absolute;right:-58px;top:-58px;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle at 34% 34%, rgba(172,0,0,.16) 0%, rgba(172,0,0,.045) 44%, rgba(172,0,0,0) 72%);
  pointer-events:none;animation:floaty 9s ease-in-out infinite;
}
.kpi-card.kpi-hero .kpi-icon{
  background:var(--grad-red) !important;color:#fff !important;
  box-shadow:0 12px 26px -10px rgba(172,0,0,.85), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -3px 7px rgba(0,0,0,.22);
}
.kpi-card.kpi-hero .kpi-value{
  background:linear-gradient(140deg,#2B2E31 0%,#50555A 62%,#7A0000 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;
}
.kpi-card.kpi-hero[data-tone=crit] .kpi-value{background:linear-gradient(140deg,#AC0000,#7A0000);-webkit-background-clip:text;background-clip:text;color:transparent;}
.kpi-hero-bar{
  box-shadow:inset 0 1px 3px rgba(43,46,49,.18);height:10px;background:var(--gray-200);
}
.kpi-hero-bar span{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 6px -2px rgba(43,46,49,.5);
  transition:filter .2s, transform .2s;
}
.kpi-hero-bar:hover span{filter:saturate(1.25);}
.kpi-hero-legend .it{
  background:rgba(255,255,255,.7);border:1px solid var(--gray-200);
  padding:3px 9px;border-radius:20px;
  box-shadow:var(--sheen), 0 1px 2px rgba(43,46,49,.05);
}
.kpi-hero-legend .it i{box-shadow:0 0 0 2px rgba(255,255,255,.85), 0 2px 4px rgba(43,46,49,.3);}

/* ---------- Painéis e gráficos ---------- */
.panel{
  background:linear-gradient(172deg,#FFFFFF 0%,#FCFCFD 100%);
  border-color:rgba(43,46,49,.10);
  box-shadow:var(--sheen), var(--edge), var(--elev-1);
  transition:box-shadow .3s var(--ease-3d), transform .3s var(--ease-3d), border-color .3s;
}
.panel:hover{box-shadow:var(--sheen), var(--elev-2);transform:translateY(-2px);}
.panel-title{
  padding-left:12px;position:relative;
}
.panel-title:before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:15px;border-radius:3px;background:var(--grad-red);
  box-shadow:0 2px 8px -2px rgba(172,0,0,.8);
}
.filterbar{
  background:linear-gradient(172deg,rgba(255,255,255,.96) 0%,rgba(250,251,251,.96) 100%);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-color:rgba(43,46,49,.09);
  box-shadow:var(--sheen), var(--elev-1);
  border-radius:16px;
}
.chip{box-shadow:var(--sheen), 0 3px 10px -6px rgba(172,0,0,.8);border:1px solid rgba(172,0,0,.14);}

/* ---------- Divisores de seção com selo ---------- */
.section-divider{margin:32px 0 18px;}
.section-divider .lbl{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,#fff,#F6F7F7);
  border:1px solid rgba(172,0,0,.16);
  padding:6px 14px;border-radius:20px;
  box-shadow:var(--sheen), 0 6px 16px -12px rgba(172,0,0,.9);
}
.section-divider .lbl:before{
  content:'';width:7px;height:7px;border-radius:2px;background:var(--grad-red);
  box-shadow:0 0 8px rgba(172,0,0,.7);transform:rotate(45deg);
}
.section-divider .line{

/* ---------- Tabela ---------- */
.table-wrap{box-shadow:var(--elev-2) !important;border-radius:16px;overflow:hidden;}

/* ---------- Modais ---------- */
.modal, .modal-box{box-shadow:var(--elev-3) !important;}

/* ---------- Empty state ilustrado ---------- */

/* ---------- Acessibilidade: respeita preferência por menos movimento ---------- */

/* ==========================================================================
   TEMPLATE OFICIAL CIA — "Concept" vermelho
   Gradiente e marca d'água reconstruídos em CSS (nítidos em qualquer largura);
   a assinatura tipográfica é o recorte do arquivo oficial, com fundo removido.
   ========================================================================== */
.hero-banner.brand-tpl{
  background:linear-gradient(168deg,#6B1919 0%,#8A1E1E 26%,#A02121 52%,#C42A2A 78%,#E42B2B 100%);
  border:none;
  box-shadow:0 18px 44px -20px rgba(107,25,25,.85), inset 0 1px 0 rgba(255,255,255,.16);
  padding:34px 40px;
  min-height:196px;
  align-items:center;
}
/* textura granulada do template */
.hero-banner.brand-tpl:before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(rgba(255,255,255,.10) .6px, transparent .6px),
    radial-gradient(rgba(0,0,0,.14) .6px, transparent .6px);
  background-size:5px 5px, 7px 7px;
  background-position:0 0, 3px 4px;
}
.hero-banner.brand-tpl:after{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 420px at 96% 130%, rgba(255,255,255,.10), transparent 62%);
  transform:none;-webkit-mask-image:none;mask-image:none;
}
/* Marca d'água "concept" — nome da empresa, sempre por inteiro.
   Em SVG com viewBox: o texto é escalado para caber na altura disponível,
   então nunca é cortado, qualquer que seja a altura do banner. */
.hb-watermark{
  position:absolute;left:16px;top:0;height:100%;width:auto;
  z-index:1;pointer-events:none;opacity:.75;
  display:flex;align-items:center;
}
.hb-watermark .wm-svg{height:100%;width:auto;display:block;}
.wm-svg text{
  font-family:var(--font-display);font-weight:800;font-size:64px;
  fill:none;stroke:rgba(255,255,255,.24);stroke-width:2.6;
  paint-order:stroke;
}
.hero-banner.slim .hb-watermark{left:13px;}
.hb-content{padding-left:78px;}
.hero-banner.slim .hb-content{padding-left:58px;}
.hero-banner.brand-tpl .hb-eyebrow{
  background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.34);color:#FFF0F0;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.hero-banner.brand-tpl .hb-eyebrow .pulse{background:#fff;box-shadow:0 0 10px #fff;}
.hero-banner.brand-tpl .hb-title{color:#fff;letter-spacing:-1.2px;}
.hero-banner.brand-tpl .hb-title em{
  background:none;-webkit-text-fill-color:#fff;color:#fff;
  border-bottom:4px solid rgba(255,255,255,.55);padding-bottom:1px;
}
.hero-banner.brand-tpl .hb-sub{color:rgba(255,255,255,.86);}
.hero-banner.brand-tpl .hb-stat{
  background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.26);
}
.hero-banner.brand-tpl .hb-stat .k{color:rgba(255,255,255,.78);}
.hero-banner.brand-tpl .hb-stat.crit .v{color:#FFD9D9;}
.hero-banner.brand-tpl .hb-stat.ok .v,
.hero-banner.brand-tpl .hb-stat.warn .v{color:#fff;}
/* assinatura oficial */
.hb-lockup{
  position:relative;z-index:2;flex-shrink:0;
  width:250px;height:auto;display:block;
  filter:drop-shadow(0 12px 24px rgba(80,0,0,.5));
}
.hero-banner.slim{padding:22px 30px;min-height:0;}
.hero-banner.slim .hb-lockup{width:112px;}
@media (max-width:1100px){
  .hb-lockup{width:180px;}
  .hero-banner.slim .hb-lockup{width:130px;}
}
@media (max-width:760px){
  .hb-lockup{display:none;}
  .hb-watermark{display:none;}
  .hb-content{padding-left:0;}
  .hero-banner.slim .hb-content{padding-left:0;}
}


/* ---------- One Page Report: blocos executivos ---------- */
.report-kpi-strip{grid-template-columns:repeat(5,1fr);}
.report-page{position:relative;}
.report-header{border-bottom:none;padding-bottom:16px;position:relative;}

@media print{

/* ---------- Marca d'água do banner ancorada à borda esquerda ---------- */
.hb-watermark{opacity:.5;}



/* ---------- Arte isométrica no rodapé da sidebar, abaixo da navegação ----------
   A altura acompanha o espaço disponível em vez de ser fixa: sob zoom o viewport
   em pixels CSS encolhe, então a arte encolhe junto e nunca é escondida. ------- */
.sidebar{overflow:hidden;}
.sidebar-art{
  position:relative;z-index:1;
  padding:6px 18px 12px;
  flex:0 0 auto;                /* fica ancorada no rodapé, sob "Configurações" */
  height:clamp(72px, 19vh, 210px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:.92;
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.55));
  pointer-events:none;
}
.sidebar-art:before{
  content:'';position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:88%;height:86%;border-radius:50%;
  background:radial-gradient(circle, rgba(172,0,0,.22) 0%, rgba(172,0,0,0) 70%);
}
/* width e height a 100% com viewBox: o SVG se ajusta preservando a proporção */
.sidebar-art svg{width:100%;height:100%;display:block;position:relative;}
/* A navegação absorve a sobra e rola sozinha se faltar espaço; assim a arte e o
   rodapé ficam sempre ancorados na base, em qualquer nível de zoom. */
.nav{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;}


/* ==========================================================================

  .report-kpi-grid > .kpi-card{padding:9px 9px 8px !important;border-radius:10px !important;}
  .report-kpi-grid .kpi-value{font-size:16px !important;margin-top:6px !important;}

  .report-panel{margin-bottom:14px !important;padding:14px !important;}

  .report-panel .report-bar-row .rlabel{width:86px !important;}

/* ---------- Grade uniforme: todos os cards com a mesma largura ----------
   O .kpi-grid usa flex, então a última linha estica os cards restantes para
   ocupar 100% — com 6 itens em 5 colunas isso deixava um card gigante sozinho.
   Aqui as colunas são iguais e a sobra fica como espaço, não como distorção. */
.kpi-grid-uniform{
  display:grid;
  grid-template-columns:repeat(3, 1fr);   /* 6 itens = 2 linhas cheias */
  align-items:stretch;
}
/* Colunas em divisores de 6, para nunca sobrar um card órfão esticado */
@media (min-width:1420px){ .kpi-grid-uniform{grid-template-columns:repeat(6, 1fr);} }
@media (max-width:900px){  .kpi-grid-uniform{grid-template-columns:repeat(2, 1fr);} }
@media (max-width:560px){  .kpi-grid-uniform{grid-template-columns:1fr;} }
.kpi-grid-uniform > .kpi-card{flex:none;min-width:0;display:flex;flex-direction:column;}
.kpi-grid-uniform > .kpi-card .kpi-label{margin-top:auto;padding-top:3px;}


/* ==========================================================================
   UNIFORMIZAÇÃO DE ENQUADRAMENTO
   Todas as grades passam a usar colunas de largura idêntica. O flexbox anterior
   esticava a última linha e distorcia os itens restantes; as proporções
   desiguais (1.3fr / 1.45fr) faziam painéis irmãos terminarem com larguras
   diferentes. Aqui tudo fica alinhado à mesma malha.
   ========================================================================== */

/* ---------- Barra de filtros: malha de colunas iguais ---------- */
.filterbar{
  display:grid;
  grid-template-columns:repeat(6, 1fr);
  gap:12px 12px;
  align-items:end;
  padding:16px 18px;
}
.filterbar > .filter-field{min-width:0;}
.filterbar > .filter-field:first-child{grid-column:span 2;}   /* período tem 2 campos */
.filterbar .multiselect, .filterbar .multiselect-btn{min-width:0;width:100%;}
.filterbar input[type=date], .filterbar select{min-width:0;width:100%;}
.filterbar #btnClearFiltersBar{width:100%;justify-content:center;height:34px;}
.filter-field label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media (max-width:1500px){ .filterbar{grid-template-columns:repeat(4, 1fr);} }
@media (max-width:1050px){ .filterbar{grid-template-columns:repeat(3, 1fr);} }
@media (max-width:800px){  .filterbar{grid-template-columns:repeat(2, 1fr);} }
@media (max-width:520px){
  .filterbar{grid-template-columns:1fr;}
  .filterbar > .filter-field:first-child{grid-column:span 1;}
}

/* ---------- Grades de KPI: colunas de largura idêntica ---------- */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
  gap:14px;margin-bottom:22px;align-items:stretch;
}
.kpi-grid > .kpi-card{flex:none;min-width:0;}
/* o card de destaque alinha exatamente com a 1ª coluna da linha de cima (3 colunas) */
.kpi-grid-hero{grid-template-columns:calc((100% - 28px)/3) repeat(3, 1fr);}
@media (max-width:1200px){ .kpi-grid-hero{grid-template-columns:calc((100% - 28px)/3) 1fr 1fr;} }
@media (max-width:900px){  .kpi-grid-hero{grid-template-columns:1fr 1fr;} }
@media (max-width:560px){  .kpi-grid-hero{grid-template-columns:1fr;} }

/* ---------- Painéis lado a lado: metade exata para cada um ---------- */
.grid-2{grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{grid-template-columns:repeat(3, 1fr);gap:16px;}
@media (max-width:1100px){ .grid-3{grid-template-columns:1fr 1fr;} }
@media (max-width:760px){  .grid-3{grid-template-columns:1fr;} }
.grid-2 > .panel, .grid-3 > .panel, .grid-2-even > .panel{min-width:0;}

/* ---------- Altura dos gráficos padronizada por linha ---------- */
.grid-2 .chart-wrap, .grid-2-even .chart-wrap{height:230px !important;}
.grid-3 .chart-wrap{height:210px !important;}


/* ---------- Tooltip próprio dos visuais em HTML ---------- */
.hover-tip{
  position:fixed;z-index:9999;pointer-events:none;
  max-width:360px;padding:9px 12px;border-radius:9px;
  background:rgba(30,32,34,.96);color:rgba(255,255,255,.9);
  border:1px solid rgba(172,0,0,.55);
  box-shadow:0 14px 34px -12px rgba(0,0,0,.75);
  font-family:var(--font-display);font-size:12px;font-weight:600;line-height:1.5;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.hover-tip b{color:#fff;font-weight:800;}
.hover-tip i{color:rgba(255,255,255,.6);font-style:normal;font-size:11px;font-weight:700;}
.hover-tip.hidden{display:none;}
/* qualquer elemento com tooltip sinaliza que há informação */
[data-tip]{cursor:help;}
.attn-row[data-tip], .resp-row[data-tip], .top-item[data-tip],
.heatmap td[data-tip]:not(.z0){cursor:pointer;}
/* realce discreto ao passar o mouse nas barras */
.fs-track:hover .fs-fill, .ir-track:hover .ir-fill,
.report-bar-track:hover .report-bar-fill{filter:brightness(1.12) saturate(1.15);}
.kpi-hero-bar span:hover{filter:brightness(1.2);}
.resp-bar-seg{transition:filter .15s;}
.resp-bar-seg:hover{filter:brightness(1.18);}
.rmix-item:hover .rmix-bar div{filter:brightness(1.15);}
.heatmap td[data-tip]:not(.z0):hover{outline:2px solid var(--red);outline-offset:-2px;}
/* o "i" abre no hover: aumenta a área sensível para não piscar */
.info-ico{position:relative;}
.info-ico:before{content:'';position:absolute;inset:-6px;border-radius:50%;}
@media print{ .hover-tip{display:none !important;} }


.sidebar-foot .sf-user{display:block;margin-top:6px;font-size:10.5px;color:var(--gray-300);}
.sidebar-foot .sf-user a{color:#FF9A9A;text-decoration:underline;font-weight:700;}

function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseD(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtD(d){ if(!d) return ''; const dt = (d instanceof Date)? d : parseD(d); if(!dt) return ''; return dt.toLocaleDateString('pt-BR'); }
function toISO(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function today(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
function isWeekend(d){ const w=d.getDay(); return w===0||w===6; }
function businessDaysBetween(start,end){
  if(!start||!end) return null;
  let sign = 1; let a=start,b=end;
  if(a>b){ sign=-1; a=end; b=start; }
  let count=0; let cur = new Date(a);
  while(cur < b){ cur.setDate(cur.getDate()+1); if(!isWeekend(cur)) count++; }
  return count*sign;
}
function weekNumber(d){
  const dt = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum = dt.getUTCDay()||7;
  dt.setUTCDate(dt.getUTCDate()+4-dayNum);
  const yearStart = new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil((((dt-yearStart)/86400000)+1)/7);
}

/* Identificação de quem está usando o painel (para o histórico de alterações).

/* Ids excluídos nesta sessão — o backend usa a lista para não “ressuscitar”
   registros ao mesclar a base com a de outro usuário. */
const EXCLUIDOS = [];

/* ---------------------------------------------------------------------------
   PROVEDORES DE ARMAZENAMENTO
   1. GoogleBackendProvider — quando o painel é servido pelo Google Apps Script.
      É o modo de produção: base única e compartilhada por todos os owners.
   2. RemoteKVProvider — armazenamento do ambiente de pré-visualização.
   3. LocalProvider — localStorage, para abrir o arquivo solto no computador.
   --------------------------------------------------------------------------- */
const MODO_GOOGLE = (typeof google !== 'undefined' && google.script && google.script.run);

class GoogleBackendProvider{
  constructor(){ this.versao = 0; }
  _chamar(fn, ...args){
    return new Promise((resolve, reject)=>{
      google.script.run
        .withSuccessHandler(r=> resolve(r))
        .withFailureHandler(e=> reject(e))
        [fn](...args);
    });
  }
  async get(key){
    const r = await this._chamar('apiLer', key);
    if(!r) return null;
    if(r.versao !== undefined) this.versao = r.versao;
    return r.valor ? JSON.parse(r.valor) : null;
  }
  async set(key, val, silencioso){
    try{
      const r = await this._chamar('apiGravar', key, JSON.stringify(val), this.versao, EXCLUIDOS, usuarioAtual());
      if(r && r.versao !== undefined) this.versao = r.versao;
      /* Se o servidor mesclou com alterações de outra pessoa, devolve a base
         consolidada e o painel se realinha na hora. */
      if(r && r.mesclado && r.valor){
        const consolidado = JSON.parse(r.valor);
        if(key === STORAGE_KEYS.demandas && Array.isArray(consolidado)){
          ds._demandas = consolidado;
          toast('Base sincronizada: havia alterações de outro responsável.');
        }
      }
      return true;
    }catch(e){ console.error('Falha ao gravar no Google:', e); if(!silencioso) toast('Não foi possível salvar. Verifique a conexão.', true); return false; }
  }
}

class RemoteKVProvider{
  async get(key){ try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
  async set(key,val){ try{ await window.storage.set(key, JSON.stringify(val), true); return true; }catch(e){ console.error('storage set falhou', e); return false; } }
}

class LocalProvider{
  async get(key){ try{ const v = localStorage.getItem(key); return v? JSON.parse(v): null; }catch(e){ return null; } }
  async set(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }
}

/* RemoteApiProvider — usado quando o painel está hospedado fora do Google
   (ex.: Vercel), mas ainda precisa ler/gravar na mesma planilha-base do
   Apps Script. Fala com a função-ponte "/api/dados" do próprio domínio
   (mesma origem — sem CORS), que por sua vez encaminha para o Apps Script
   no servidor, longe do navegador. */
class RemoteApiProvider{
  constructor(){ this.versao = 0; }
  async get(key){
    try{
      const r = await fetch('/api/dados?acao=ler&chave=' + encodeURIComponent(key), { cache: 'no-store' });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if(j.versao !== undefined) this.versao = j.versao;
      return j.valor ? JSON.parse(j.valor) : null;
    }catch(e){ console.error('Falha ao ler a base remota:', e); return null; }
  }
  async set(key, val, silencioso){
    /* A chamada ao Apps Script por fora do Google é intermitente — funciona
       na maior parte das vezes, mas ocasionalmente esbarra num redirecionamento
       que o Google trata mal. Por isso tenta de novo uma vez, automaticamente,
       antes de desistir e avisar o usuário. */
    for(let tentativa=1; tentativa<=2; tentativa++){
      try{
        const r = await fetch('/api/dados', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ acao:'gravar', chave:key, textoJson: JSON.stringify(val), versaoBase: this.versao, excluidos: EXCLUIDOS, usuario: usuarioAtual() })
        });
        if(!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        if(j.versao !== undefined) this.versao = j.versao;
        if(j.mesclado && j.valor){
          const consolidado = JSON.parse(j.valor);
          if(key === STORAGE_KEYS.demandas && Array.isArray(consolidado)){
            ds._demandas = consolidado;
            toast('Base sincronizada: havia alterações de outro responsável.');
          }
        }
        return true;
      }catch(e){
        console.error(`Falha ao gravar na base remota (tentativa ${tentativa}/2):`, e);
        if(tentativa===2){ if(!silencioso) toast('Não foi possível salvar. Verifique a conexão.', true); return false; }
        await new Promise(res=>setTimeout(res, 700));
      }
    }
  }
}

function escolherProvider(){
  if(MODO_GOOGLE) return new GoogleBackendProvider();
  if(typeof window.storage !== 'undefined' && window.storage) return new RemoteKVProvider();
  /* Servido por http(s) num domínio próprio (ex.: Vercel) mas fora do Google
     e fora do preview do Claude: usa a ponte "/api/dados". Um arquivo aberto
     direto do disco (file://) continua caindo no LocalProvider, como antes. */
  if(location.protocol !== 'file:') return new RemoteApiProvider();
  return new LocalProvider();
}

class DataService{
  constructor(provider){ this.provider = provider; this._demandas=null; this._config=null; this._audit=null; }

  async init(){
    let d = await this.provider.get(STORAGE_KEYS.demandas);
    if(!d || !Array.isArray(d) || d.length===0){ d = JSON.parse(JSON.stringify(SEED_DEMANDAS)); await this.provider.set(STORAGE_KEYS.demandas, d); }
    this._demandas = d;
    let c = await this.provider.get(STORAGE_KEYS.config);
    if(!c){ c = JSON.parse(JSON.stringify(DEFAULT_CONFIG)); await this.provider.set(STORAGE_KEYS.config, c); }
    this._config = c;
    let a = await this.provider.get(STORAGE_KEYS.audit);
    this._audit = a || {};
    let meta = await this.provider.get(STORAGE_KEYS.meta);
    if(!meta){ meta = {lastUpdate:new Date().toISOString()}; await this.provider.set(STORAGE_KEYS.meta, meta); }
    this._meta = meta;

    await this._migrarOwners();
  }

  /* Alinha bases já gravadas ao quadro oficial de owners: substitui a lista de
     responsáveis, reatribui os registros pelos nomes antigos e preserva quem
     não estiver no de-para (entra como inativo, para não sumir do histórico). */
  async _migrarOwners(){
    const oficiais = OWNERS_GC.map(o=>o.nome);
    const atuais = (this._config.responsaveis||[]).map(r=>r.nome);
    const jaMigrado = oficiais.every(n=> atuais.includes(n));
    if(jaMigrado) return;

    let alterou = 0;
    this._demandas.forEach(d=>{
      const novo = OWNERS_LEGADO[d.responsavel];
      if(novo && novo!==d.responsavel){ d.responsavel = novo; alterou++; }
    });

    const usados = new Set(this._demandas.map(d=>d.responsavel).filter(Boolean));
    const extras = [...usados].filter(n=> !oficiais.includes(n))
      .map(n=>({nome:n, email:'', ativo:false}));
    this._config.responsaveis = OWNERS_GC.map(o=>({nome:o.nome, email:o.email, ativo:true})).concat(extras);

    await this.provider.set(STORAGE_KEYS.config, this._config);
    if(alterou) await this.provider.set(STORAGE_KEYS.demandas, this._demandas);
    console.info('Owners de Gente & Cultura atualizados. Registros reatribuídos:', alterou);
  }

  getDemandas(){ return this._demandas; }
  getDemanda(id){ return this._demandas.find(d=>d.id===id); }
  getConfig(){ return this._config; }
  getHistory(id){ return this._audit[id] || []; }

  nextId(){
    let max=0;
    this._demandas.forEach(d=>{ const n = parseInt((d.id||'').split('-')[1],10); if(!isNaN(n)&&n>max) max=n; });
    return 'DEM-'+String(max+1).padStart(3,'0');
  }

  async _persistDemandas(){ await this._touchMeta(); return this.provider.set(STORAGE_KEYS.demandas, this._demandas); }
  async _persistConfig(){ await this._touchMeta(); return this.provider.set(STORAGE_KEYS.config, this._config); }
  /* Metadados ("última atualização") e auditoria (histórico de alterações) são
     gravações de apoio — se uma delas falhar isoladamente, a demanda em si já
     foi salva e não há perda de dado; por isso não interrompem o usuário com
     um toast de erro (silencioso=true). */
  async _persistAudit(){ return this.provider.set(STORAGE_KEYS.audit, this._audit, true); }
  async _touchMeta(){ this._meta.lastUpdate = new Date().toISOString(); await this.provider.set(STORAGE_KEYS.meta, this._meta, true); }

  _logHistory(id, texto){ if(!this._audit[id]) this._audit[id]=[]; this._audit[id].unshift({ts:new Date().toISOString(), texto, por: usuarioAtual()||'Não identificado'}); this._persistAudit(); }

  async createDemanda(payload){
    const id = this.nextId();
    const nowISO = toISO(new Date());
    const rec = Object.assign({ id, ultimaAtualizacao: nowISO, criadoEm: nowISO, criadoPor: usuarioAtual()||'Não identificado', alteradoPor: usuarioAtual()||'Não identificado' }, payload);
    this._demandas.push(rec);
    await this._persistDemandas();
    this._logHistory(id, `Demanda criada com status "${rec.status}" (editorial: "${rec.statusEditorial}").`);
    return rec;
  }

  async updateDemanda(id, payload){
    const idx = this._demandas.findIndex(d=>d.id===id);
    if(idx===-1) return null;
    const before = this._demandas[idx];
    const changes=[];
    Object.keys(payload).forEach(k=>{ if(String(before[k]??'') !== String(payload[k]??'')) changes.push({campo:k, de:before[k], para:payload[k]}); });
    const updated = Object.assign({}, before, payload, {ultimaAtualizacao: toISO(new Date()), alteradoPor: usuarioAtual()||'Não identificado'});
    this._demandas[idx] = updated;
    await this._persistDemandas();
    changes.forEach(c=>{ const label = FIELD_LABELS[c.campo] || c.campo; this._logHistory(id, `${label} alterado de "${fmtVal(c.campo,c.de)}" para "${fmtVal(c.campo,c.para)}".`); });
    if(changes.length===0) this._logHistory(id, 'Registro salvo sem alterações de campo.');
    return updated;
  }

  async deleteDemanda(id){ if(!EXCLUIDOS.includes(id)) EXCLUIDOS.push(id); this._demandas = this._demandas.filter(d=>d.id!==id); await this._persistDemandas(); }

  async duplicateDemanda(id){
    const base = this.getDemanda(id);
    if(!base) return null;
    const clone = Object.assign({}, base, {
      id: this.nextId(), titulo: base.titulo + ' (cópia)', status:'Backlog', statusEditorial:'Solicitação recebida',
      dataInicio:null, dataConclusao:null, dataRealPublicacao:null, dataSolicitacao: toISO(new Date()), ultimaAtualizacao: toISO(new Date()),
      alcance:0, visualizacoes:0, curtidas:0, comentarios:0, cliques:0, compartilhamentos:0, acoesConversoes:0, resultadoLeitura:''
    });
    this._demandas.push(clone);
    await this._persistDemandas();
    this._logHistory(clone.id, `Registro duplicado a partir de ${id}.`);
    return clone;
  }

  async saveConfig(cfg){ this._config = cfg; await this._persistConfig(); }

  exportJSON(){ return JSON.stringify({demandas:this._demandas, config:this._config, exportadoEm:new Date().toISOString()}, null, 2); }
  exportCSV(){
    const cols = ['id','dataSolicitacao','areaSolicitante','solicitante','titulo','descricao','editoria','subcategoria','responsavel','prioridade','status','dataInicio','dataPlanejadaPublicacao','dataConclusao','complexidade','esforco','bloqueio','ultimaAtualizacao','observacoes','publicoAlvo','objetivo','cta','canalPrincipal','canaisApoio','horarioPlanejado','dataRealPublicacao','statusEditorial','alcance','visualizacoes','curtidas','comentarios','cliques','compartilhamentos','acoesConversoes','resultadoLeitura'];
    const rows = [cols.join(';')];
    this._demandas.forEach(d=>{ rows.push(cols.map(c=>{ let v=d[c]??''; v=String(v).replace(/;/g,','); return v; }).join(';')); });
    return rows.join('\n');
  }
  async importJSON(text){
    const data = JSON.parse(text);
    if(data.demandas && Array.isArray(data.demandas)){ this._demandas = data.demandas; await this._persistDemandas(); }
    if(data.config){ this._config = data.config; await this._persistConfig(); }
    return true;
  }
}

const FIELD_LABELS = {status:'Status', responsavel:'Responsável/Owner', prioridade:'Prioridade', dataPlanejadaPublicacao:'Data planejada de publicação', editoria:'Editoria', subcategoria:'Subcategoria', dataConclusao:'Data de conclusão', complexidade:'Complexidade', esforco:'Esforço', areaSolicitante:'Área solicitante', bloqueio:'Bloqueio/Dependência', observacoes:'Observações gerais', titulo:'Título da demanda', descricao:'Descrição', dataInicio:'Data de início', solicitante:'Solicitante', dataSolicitacao:'Data da solicitação', publicoAlvo:'Público-alvo', objetivo:'Objetivo da comunicação', cta:'CTA', canalPrincipal:'Canal principal', canaisApoio:'Canais de apoio', horarioPlanejado:'Horário planejado', dataRealPublicacao:'Data real de publicação', statusEditorial:'Status editorial', alcance:'Alcance', visualizacoes:'Visualizações', curtidas:'Curtidas/Reações', comentarios:'Comentários', cliques:'Cliques', compartilhamentos:'Compartilhamentos', acoesConversoes:'Ações/Conversões', resultadoLeitura:'Resultado/Leitura do desempenho'};
function fmtVal(campo,v){
  if(['dataPlanejadaPublicacao','dataConclusao','dataInicio','dataSolicitacao','dataRealPublicacao'].includes(campo)) return v? fmtD(v): '—';
  return (v===null||v===undefined||v==='')? '—' : v;
}

/* --------------------------- REGRAS DE NEGÓCIO --------------------------- */
function enrichList(rawList, config, refDate){
  const t = refDate || today();
  const base = rawList.map(d=>{
    const dSol = parseD(d.dataSolicitacao);
    const dPlan = parseD(d.dataPlanejadaPublicacao);
    const dConc = parseD(d.dataConclusao);
    const dInicio = parseD(d.dataInicio);
    const dReal = parseD(d.dataRealPublicacao);
    const isFinalOp = STATUS_FINAIS.includes(d.status);
    const endForOpen = isFinalOp ? (dConc||t) : t;

    const diasEmAberto = dSol ? businessDaysBetween(dSol, endForOpen) : null;
    const aging = diasEmAberto!==null ? agingBucket(Math.max(diasEmAberto,0)) : '—';
    const atrasada = (!isFinalOp && dPlan && dPlan < t);
    const diasParaPublicacao = dPlan ? businessDaysBetween(t, dPlan) : null;
    const leadTime = (d.status==='Concluída' && dSol && dConc) ? businessDaysBetween(dSol, dConc) : null;

    const prioCfg = (config.prioridades||[]).find(p=>p.nome===d.prioridade);
    const slaDias = prioCfg ? prioCfg.slaDias : null;
    let sla = 'N/A';
    if(d.status==='Cancelada'){ sla='N/A'; }
    else if(d.status==='Concluída'){ sla = (leadTime!==null && slaDias!==null) ? (leadTime<=slaDias?'Dentro':'Fora') : 'N/A'; }
    else if(slaDias!==null && diasEmAberto!==null){ sla = diasEmAberto<=slaDias ? 'Dentro':'Fora'; }

    let statusGerencial;
    if(d.status==='Concluída') statusGerencial='Concluída';
    else if(d.status==='Cancelada') statusGerencial='Cancelada';
    else if(atrasada) statusGerencial='Atrasada';
    else if(d.status==='Bloqueada') statusGerencial='Bloqueada';
    else if(diasParaPublicacao!==null && diasParaPublicacao>=0 && diasParaPublicacao<=7) statusGerencial='Vence em até 7 dias';
    else statusGerencial='Em curso';

    const mes = dSol ? monthLabel(dSol) : '—';
    const semana = dSol ? weekNumber(dSol) : null;
    const diaSemana = dPlan ? DIAS_SEMANA[dPlan.getDay()] : null;

    const alcance = Number(d.alcance)||0;
    const cliques = Number(d.cliques)||0;
    const taxaEngajamento = alcance>0 ? (Number(d.curtidas||0)+Number(d.comentarios||0)+Number(d.compartilhamentos||0))/alcance : 0;
    const taxaClique = alcance>0 ? cliques/alcance : 0;
    const taxaConversao = cliques>0 ? (Number(d.acoesConversoes||0))/cliques : 0;
    const isFinalEditorial = STATUS_EDITORIAL_FINAL.includes(d.statusEditorial);

    return Object.assign({}, d, {
      _dSol:dSol, _dPlan:dPlan, _dConc:dConc, _dInicio:dInicio, _dReal:dReal,
      diasEmAberto, aging, atrasada, diasParaPublicacao, leadTime, sla, statusGerencial, mes, semana, diaSemana,
      taxaEngajamento, taxaClique, taxaConversao, isFinalEditorial
    });
  });

  // Alerta Editorial: múltiplas P1/P2 no mesmo dia + publicação próxima não finalizada editorialmente
  const groups = {};
  base.forEach(d=>{
    if(!d._dPlan || d.statusEditorial==='Cancelada' || !PRIORIDADES_ALERTA.includes(d.prioridade)) return;
    const k = toISO(d._dPlan);
    (groups[k]=groups[k]||[]).push(d.id);
  });
  const multiIds = new Set();
  Object.values(groups).forEach(ids=>{ if(ids.length>=2) ids.forEach(id=>multiIds.add(id)); });

  return base.map(d=>{
    const alerts = [];
    if(multiIds.has(d.id)) alerts.push('⚠ Múltiplas P1/P2 no mesmo dia');
    if(!d.isFinalEditorial && d.diasParaPublicacao!==null && d.diasParaPublicacao<=ALERT_DAYS_THRESHOLD) alerts.push('⏰ Publicação próxima e não finalizada');
    return Object.assign({}, d, {alertaEditorial: alerts.join(' | ')});
  });
}

/* Atualiza os dados a partir do armazenamento compartilhado (útil quando
   outro analista alterou a base) sem perder a tela/filtros atuais. */
async function refreshData(){
  const btn = $('#btnRefresh');
  if(btn){ btn.disabled = true; btn.classList.add('spinning'); }
  try{
    await ds.init();
    recomputeDerived();
    renderView();
    toast('Dados atualizados com sucesso.');
  }catch(e){
    toast('Não foi possível atualizar os dados agora.', true);
  }finally{
    if(btn){ btn.disabled = false; btn.classList.remove('spinning'); }
  }
}
function recomputeDerived(){
  const cfg = ds.getConfig();
  state.config = cfg;
  state.demandas = enrichList(ds.getDemandas(), cfg);
}
function activeLists(){
  const c = state.config;
  return {
    status: c.status.filter(x=>x.ativo).map(x=>x.nome),
    prioridades: c.prioridades.filter(x=>x.ativo),
    responsaveis: c.responsaveis.filter(x=>x.ativo).map(x=>x.nome),
    responsaveisAll: c.responsaveis.map(x=>x.nome),
    editorias: c.editorias.filter(x=>x.ativo).map(x=>x.nome),
    subcategorias: c.subcategorias.filter(x=>x.ativo).map(x=>x.nome),
    areas: c.areasSolicitantes.filter(x=>x.ativo).map(x=>x.nome),
